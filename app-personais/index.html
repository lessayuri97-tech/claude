<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PT example</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: barra superior fixa + coluna única de conteúdo (máx. 1040px); fichas de treino em linhas tipo planilha que viram cartões no celular */
:root {
  --bg: #f5f4f2;
  --surface: #ffffff;
  --surface-2: #eceae7;
  --line: #dcdad5;
  --fg: #1c1c1b;
  --muted: #6b6a66;
  --accent: #262625;
  --accent-ink: #ffffff;
  --accent-soft: #e8e6e2;
  --ok: #3f6b4f;
  --ok-soft: #e1ebe3;
  --danger: #a3332d;
  --danger-soft: #f5e1df;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Barlow", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141414; --surface: #1c1c1b; --surface-2: #262625; --line: #353533;
    --fg: #ecebe8; --muted: #a09e99; --accent: #e8e6e2; --accent-ink: #161616; --accent-soft: #2e2e2c;
    --ok: #8fc29f; --ok-soft: #22302a; --danger: #e8877f; --danger-soft: #3a2220;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141414; --surface: #1c1c1b; --surface-2: #262625; --line: #353533;
  --fg: #ecebe8; --muted: #a09e99; --accent: #e8e6e2; --accent-ink: #161616; --accent-soft: #2e2e2c;
  --ok: #8fc29f; --ok-soft: #22302a; --danger: #e8877f; --danger-soft: #3a2220;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; letter-spacing: .01em; line-height: 1.1; margin: 0; text-wrap: balance; }
h1 { font-size: 2rem; }
h2 { font-size: 1.5rem; }
h3 { font-size: 1.2rem; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.eyebrow { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }

/* Barra superior */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.topbar .wrap { display: flex; align-items: center; gap: 16px; padding-block: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--fg); }
.brand-mark { width: 34px; height: 34px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; }
.brand-mark svg { width: 22px; height: 22px; }
.brand b { font-family: var(--font-display); font-size: 1.45rem; letter-spacing: .02em; }
.nav { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
.nav a { text-decoration: none; color: var(--muted); font-weight: 600; padding: 6px 12px; border-radius: 999px; }
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.nav a:hover { color: var(--fg); }

main.wrap { padding-block: 24px 64px; display: grid; gap: 20px; }

/* Botões e campos */
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 7px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; text-decoration: none; color: var(--fg); white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--fg); background: var(--surface-2); }
.btn.danger { color: var(--danger); }
.btn.sm { padding: 4px 10px; font-size: .85rem; }
.btn.icon { padding: 6px; width: 32px; height: 32px; justify-content: center; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spread { justify-content: space-between; }
label.field { display: grid; gap: 4px; font-size: .85rem; color: var(--muted); font-weight: 600; min-width: 0; }
input[type=text], input[type=url], input[type=tel], input[type=date], input[type=number], input[type=search], select, textarea {
  width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; color: var(--fg); font-weight: 400; font-size: .95rem; min-width: 0;
}
textarea { resize: vertical; min-height: 64px; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.form-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
.form-grid .wide { grid-column: 1 / -1; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: grid; gap: 14px; min-width: 0; }
.chip { display: inline-block; font-size: .75rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.chip.accent { background: var(--accent-soft); color: var(--accent); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.banner { background: var(--accent-soft); color: var(--fg); border-radius: var(--radius); padding: 10px 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: .9rem; }
.banner .btn { margin-left: auto; }
.empty { text-align: center; padding: 28px 16px; color: var(--muted); display: grid; gap: 10px; justify-items: center; }

/* Lista de alunos */
.page-head { display: flex; gap: 12px; align-items: end; flex-wrap: wrap; justify-content: space-between; }
.cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.card-aluno { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 10px; text-decoration: none; color: var(--fg); }
.card-aluno:hover { border-color: var(--accent); }
.card-aluno .top { display: flex; gap: 12px; align-items: center; }
.avatar-ini { width: 42px; height: 42px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; color: var(--muted); flex: none; }
.card-aluno h3 { font-size: 1.25rem; }
.stats { display: flex; gap: 16px; flex-wrap: wrap; font-size: .85rem; color: var(--muted); }
.stats b { color: var(--fg); font-weight: 600; }

/* Detalhe do aluno */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 10px 16px; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }

/* Ficha de treino */
.treino { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.treino-head { display: flex; gap: 10px; align-items: center; padding: 12px 14px; background: var(--surface-2); flex-wrap: wrap; }
.treino-letter { font-family: var(--font-display); font-size: 1.4rem; font-weight: 700; width: 36px; height: 36px; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); border-radius: 8px; flex: none; }
.treino-head input { max-width: 320px; font-weight: 600; }
.treino-head .row { margin-left: auto; }
.ficha-cols, .ficha-row { display: grid; grid-template-columns: 28px minmax(0, 2.4fr) 70px 80px 80px 80px minmax(0, 1.4fr) 80px; gap: 8px; align-items: center; padding: 8px 14px; }
.ficha-cols { font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--line); }
.ficha-row { border-bottom: 1px solid var(--line); }
.ficha-row:last-child { border-bottom: 0; }
.ficha-row .ord { font-family: var(--font-display); font-weight: 700; color: var(--muted); font-size: 1.1rem; }
.ficha-row input, .ficha-row select { padding: 6px 8px; font-size: .9rem; }
.ex-cell { display: flex; gap: 8px; align-items: center; min-width: 0; }
.ex-cell select { flex: 1; }
.play { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); cursor: pointer; display: grid; place-items: center; }
.play svg { width: 12px; height: 12px; margin-left: 2px; }
.play.novideo { background: transparent; color: var(--muted); border: 1.5px dashed var(--line); }
.play[disabled] { background: var(--surface-2); color: var(--muted); cursor: default; }
.ficha-actions { display: flex; gap: 2px; justify-content: end; }
.treino-foot { padding: 10px 14px; display: flex; gap: 8px; flex-wrap: wrap; }
.m-label { display: none; }

/* Biblioteca de exercícios */
.lib { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.ex-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; display: grid; grid-template-rows: auto 1fr; }
.thumb { position: relative; aspect-ratio: 16 / 9; max-width: 100%; background: var(--surface-2); border: 0; padding: 0; cursor: pointer; display: block; width: 100%; overflow: hidden; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb .ph { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: .85rem; text-align: center; padding: 12px; }
.thumb .bigplay { position: absolute; inset: 0; margin: auto; width: 52px; height: 36px; border-radius: 10px; background: rgba(20, 20, 20, .78); display: grid; place-items: center; }
.thumb .bigplay svg { width: 16px; height: 16px; fill: #fff; margin-left: 3px; }
.thumb[disabled] { cursor: default; }
.ex-body { padding: 12px 14px; display: grid; gap: 6px; align-content: start; }
.ex-body h3 { font-size: 1.15rem; }
.filters { display: flex; gap: 10px; flex-wrap: wrap; }
.filters input { max-width: 280px; }
.filters select { max-width: 200px; }

/* Sessões e medidas */
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
td.num, th.num { text-align: right; }
.sessao { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 6px; background: var(--surface); }
.sessao ul { margin: 0; padding-left: 18px; font-size: .9rem; }
.reg-row { display: grid; grid-template-columns: 28px minmax(0, 1fr) 120px 90px 90px; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
.reg-row:last-child { border-bottom: 0; }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font-body); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .line { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.chart .area { fill: var(--accent-soft); stroke: none; }
.chart .dot { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }
.chart .dot.last { fill: var(--accent); }
.grid-2 { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.grid-2 > * { min-width: 0; }

/* Modal */
dialog { border: 0; border-radius: 14px; padding: 0; background: var(--surface); color: var(--fg); width: min(760px, calc(100vw - 32px)); max-height: calc(100vh - 48px); box-shadow: 0 24px 60px rgba(0, 0, 0, .35); }
dialog::backdrop { background: rgba(10, 15, 25, .6); }
.dlg { display: grid; gap: 14px; padding: 18px; }
.video-box { position: relative; aspect-ratio: 16 / 9; max-width: 100%; background: #000; border-radius: 8px; overflow: hidden; }
.video-box iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-weight: 600; z-index: 50; font-size: .9rem; }
textarea.share { min-height: 260px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .82rem; }

@media (max-width: 760px) {
  h1 { font-size: 1.7rem; }
  .ficha-cols { display: none; }
  .ficha-row { grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 12px 14px; row-gap: 8px; }
  .ficha-row .ord { display: none; }
  .ficha-row .ex-cell { grid-column: 1 / -1; }
  .ficha-row .obs { grid-column: 1 / -1; }
  .ficha-row .ficha-actions { grid-column: 1 / -1; justify-content: start; }
  .m-label { display: block; font-size: .7rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
  .reg-row { grid-template-columns: 28px minmax(0, 1fr) 1fr 1fr; }
  .reg-row .meta { grid-column: 2 / -1; }
  .treino-head input { max-width: none; flex: 1; }
  .treino-head .row { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <a class="brand" href="#alunos" aria-label="PT example, início">
      <span class="brand-mark" aria-hidden="true"><span style="font-family:var(--font-display);font-weight:700;color:var(--accent-ink);font-size:1.05rem;letter-spacing:.02em">PT</span></span>
      <b>PT example</b><span class="small muted" style="margin-left:-4px">Personal Trainer</span>
    </a>
    <nav class="nav" aria-label="Seções">
      <a href="#alunos" data-nav="alunos">Alunos</a>
      <a href="#exercicios" data-nav="exercicios">Exercícios</a>
      <a href="#backup" data-nav="backup">Backup</a>
    </nav>
  </div>
</header>
<main class="wrap" id="app"></main>

<dialog id="dlg"><div class="dlg" id="dlg-body"></div></dialog>

<script>
(() => {
'use strict';

/* ---------- Armazenamento ---------- */
const KEY = 'pt-example:v1';
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const hoje = () => new Date().toISOString().slice(0, 10);
const diasAtras = n => { const d = new Date(); d.setDate(d.getDate() - n); return d.toISOString().slice(0, 10); };

function exemplo() {
  const ex = [
    ['Agachamento livre', 'Pernas'], ['Leg press 45°', 'Pernas'], ['Cadeira extensora', 'Pernas'], ['Mesa flexora', 'Pernas'],
    ['Supino reto com barra', 'Peito'], ['Supino inclinado com halteres', 'Peito'], ['Puxada frontal', 'Costas'], ['Remada baixa', 'Costas'],
    ['Desenvolvimento com halteres', 'Ombros'], ['Elevação lateral', 'Ombros'], ['Rosca direta', 'Braços'], ['Tríceps na polia', 'Braços'],
    ['Prancha', 'Core'], ['Elevação pélvica', 'Glúteos']
  ].map(([nome, grupo]) => ({ id: uid(), nome, grupo, url: '', notas: '' }));
  const E = n => ex.find(e => e.nome === n).id;
  const item = (n, series, reps, carga, descanso, obs = '') => ({ id: uid(), exId: E(n), series, reps, carga, descanso, obs });
  const tA = { id: uid(), nome: 'Inferiores', itens: [
    item('Agachamento livre', 4, '8-10', 60, 90, 'Descer até 90°'),
    item('Leg press 45°', 4, '10-12', 180, 90),
    item('Cadeira extensora', 3, '12', 45, 60),
    item('Mesa flexora', 3, '12', 35, 60),
    item('Elevação pélvica', 3, '12', 80, 60)
  ]};
  const tB = { id: uid(), nome: 'Superiores', itens: [
    item('Supino reto com barra', 4, '8-10', 50, 90),
    item('Puxada frontal', 4, '10', 55, 90),
    item('Desenvolvimento com halteres', 3, '10', 14, 60, 'Carga por halter'),
    item('Remada baixa', 3, '12', 50, 60),
    item('Tríceps na polia', 3, '12', 25, 45),
    item('Rosca direta', 3, '12', 20, 45)
  ]};
  const sessoes = [];
  [26, 21, 16, 12, 7, 2].forEach((d, i) => {
    const t = i % 2 ? tB : tA;
    sessoes.push({ id: uid(), data: diasAtras(d), treinoId: t.id, treinoNome: t.nome, rpe: 7 + (i % 3 === 0 ? 1 : 0), nota: i === 4 ? 'Reclamou de dor leve no joelho direito' : '',
      itens: t.itens.map(it => ({ exId: it.exId, carga: +it.carga + Math.floor(i / 2) * 2.5, reps: it.reps.split('-')[0], feito: true })) });
  });
  const medidas = [[28, 82.4, 24.1, 92], [14, 81.3, 23.4, 90.5], [1, 80.6, 22.8, 89]].map(([d, peso, gordura, cintura]) => ({ id: uid(), data: diasAtras(d), peso, gordura, cintura, quadril: '', braco: '' }));
  const tC = { id: uid(), nome: 'Full body', itens: [
    item('Leg press 45°', 3, '12-15', 120, 60),
    item('Puxada frontal', 3, '12', 40, 60),
    item('Supino inclinado com halteres', 3, '12', 12, 60, 'Carga por halter'),
    item('Elevação lateral', 3, '15', 6, 45),
    item('Prancha', 3, '30s', '', 45, 'Tempo em segundos')
  ]};
  const sessC = [15, 11, 8, 4, 1].map((d, i) => ({ id: uid(), data: diasAtras(d), treinoId: tC.id, treinoNome: 'Treino A · Full body', rpe: 6 + (i > 2 ? 1 : 0), nota: '',
    itens: tC.itens.map(it => ({ exId: it.exId, carga: it.carga === '' ? '' : +it.carga + (it.carga > 50 ? i * 5 : Math.floor(i / 2) * 1), reps: it.reps.split('-')[0], feito: !(i === 2 && it === tC.itens[3]) })) }));
  const medC = [[17, 96.8, 31.5, 108], [10, 95.1, 30.9, 106], [2, 93.9, 30.2, 104.5]].map(([d, peso, gordura, cintura]) => ({ id: uid(), data: diasAtras(d), peso, gordura, cintura, quadril: '', braco: '' }));
  return {
    exemplo: true,
    exercicios: ex,
    alunos: [
      { id: uid(), nome: 'Mariana Souza', objetivo: 'Hipertrofia', telefone: '(11) 98765-4321', inicio: diasAtras(30), notas: 'Treina 4x por semana, de manhã.', treinos: [tA, tB], sessoes, medidas },
      { id: uid(), nome: 'Carlos Lima', objetivo: 'Emagrecimento', telefone: '(21) 99123-4567', inicio: diasAtras(18), notas: 'Hérnia de disco L5 (liberado pelo médico). Evitar carga axial alta.', treinos: [tC], sessoes: sessC, medidas: medC },
      { id: uid(), nome: 'Ana Ribeiro', objetivo: 'Condicionamento', telefone: '', inicio: diasAtras(3), notas: '', treinos: [], sessoes: [], medidas: [] }
    ]
  };
}

let db;
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) { db = JSON.parse(raw); return; } } catch (e) {}
  db = exemplo();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} }
load();

/* ---------- Utilidades ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtData = iso => { if (!iso) return ''; const [y, m, d] = iso.split('-'); return `${d}/${m}/${y}`; };
const fmtNum = n => (n === '' || n == null || isNaN(n)) ? '' : (+n).toLocaleString('pt-BR', { maximumFractionDigits: 1 });
const iniciais = nome => nome.trim().split(/\s+/).filter(Boolean).map(p => p[0]).slice(0, 2).join('').toUpperCase();
const LETRAS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const GRUPOS = ['Pernas', 'Glúteos', 'Peito', 'Costas', 'Ombros', 'Braços', 'Core', 'Cardio', 'Mobilidade', 'Outro'];
const exById = id => db.exercicios.find(e => e.id === id);
const alunoById = id => db.alunos.find(a => a.id === id);

function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; t.setAttribute('role', 'status');
  document.body.appendChild(t); setTimeout(() => t.remove(), 2200);
}

/* Aceita: youtube.com/watch?v=ID, youtu.be/ID, /shorts/ID, /embed/ID, /live/ID, m.youtube.com, ou só o ID */
function ytParse(url) {
  const s = String(url || '').trim();
  if (!s) return null;
  const m = s.match(/(?:youtube(?:-nocookie)?\.com\/(?:watch\?(?:[^#]*&)?v=|embed\/|shorts\/|live\/|v\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);
  const id = m ? m[1] : (/^[A-Za-z0-9_-]{11}$/.test(s) ? s : null);
  if (!id) return null;
  let start = 0;
  const t = s.match(/[?&#](?:t|start)=(?:(\d+)h)?(?:(\d+)m)?(\d+)?s?/);
  if (t) start = (+(t[1] || 0)) * 3600 + (+(t[2] || 0)) * 60 + (+(t[3] || 0));
  return { id, start };
}

function chartSVG(pts, unidade) {
  if (pts.length < 2) return `<p class="muted small" style="margin:0">Registre pelo menos duas vezes para ver o gráfico.</p>`;
  const W = 520, H = 200, L = 44, R = 16, T = 14, B = 28;
  const xs = pts.map(p => new Date(p.x + 'T12:00').getTime()), ys = pts.map(p => +p.y);
  let y0 = Math.min(...ys), y1 = Math.max(...ys);
  if (y0 === y1) { y0 -= 1; y1 += 1; }
  const pad = (y1 - y0) * 0.15; y0 -= pad; y1 += pad;
  const step = niceStep((y1 - y0) / 4); y0 = Math.floor(y0 / step) * step; y1 = Math.ceil(y1 / step) * step;
  const x0 = Math.min(...xs), x1 = Math.max(...xs) === x0 ? x0 + 1 : Math.max(...xs);
  const sx = x => L + (x - x0) / (x1 - x0) * (W - L - R), sy = y => T + (1 - (y - y0) / (y1 - y0)) * (H - T - B);
  let grid = '';
  for (let v = y0; v <= y1 + 1e-9; v += step) grid += `<line class="grid" x1="${L}" x2="${W - R}" y1="${sy(v)}" y2="${sy(v)}"/><text x="${L - 6}" y="${sy(v) + 4}" text-anchor="end">${fmtNum(v)}</text>`;
  const path = pts.map((p, i) => `${i ? 'L' : 'M'}${sx(xs[i]).toFixed(1)},${sy(ys[i]).toFixed(1)}`).join(' ');
  const area = `${path} L${sx(xs[xs.length - 1]).toFixed(1)},${H - B} L${sx(xs[0]).toFixed(1)},${H - B} Z`;
  const lbl = i => `<text x="${sx(xs[i])}" y="${H - 8}" text-anchor="${i === 0 ? 'start' : 'end'}">${fmtData(pts[i].x).slice(0, 5)}</text>`;
  const dots = pts.map((p, i) => `<circle class="dot ${i === pts.length - 1 ? 'last' : ''}" cx="${sx(xs[i])}" cy="${sy(ys[i])}" r="${i === pts.length - 1 ? 4.5 : 3.5}"><title>${fmtData(p.x)}: ${fmtNum(p.y)} ${unidade}</title></circle>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de evolução em ${unidade}">${grid}<path class="area" d="${area}" opacity=".6"/><path class="line" d="${path}"/>${dots}${lbl(0)}${lbl(pts.length - 1)}</svg>`;
}
function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw || 1))); const n = raw / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }
function delta(pts, unidade, menosEhMelhor) {
  if (pts.length < 2) return '';
  const d = pts[pts.length - 1].y - pts[0].y; if (!d) return `<span class="chip num">sem variação</span>`;
  const bom = menosEhMelhor ? d < 0 : d > 0;
  return `<span class="chip ${bom ? 'ok' : ''} num">${d > 0 ? '+' : ''}${fmtNum(d)} ${unidade}</span>`;
}

function tabEvolucao(a) {
  const meds = a.medidas.slice().sort((x, y) => x.data.localeCompare(y.data));
  const serie = k => meds.filter(m => m[k] !== '' && m[k] != null && !isNaN(m[k])).map(m => ({ x: m.data, y: +m[k] }));
  const peso = serie('peso');
  // carga máxima por exercício ao longo das sessões
  const porEx = {};
  a.sessoes.slice().sort((x, y) => x.data.localeCompare(y.data)).forEach(s => s.itens.forEach(i => {
    if (!i.feito || i.carga === '' || isNaN(i.carga)) return;
    const arr = (porEx[i.exId] ||= []); const last = arr[arr.length - 1];
    if (last && last.x === s.data) last.y = Math.max(last.y, +i.carga); else arr.push({ x: s.data, y: +i.carga });
  }));
  const exIds = Object.keys(porEx).filter(id => exById(id));
  const selEx = ui.exEvo && porEx[ui.exEvo] ? ui.exEvo : exIds[0];
  return `<div class="grid-2">
    <div class="panel"><div class="row spread"><div><div class="eyebrow">Peso corporal</div><h2 class="num">${peso.length ? fmtNum(peso[peso.length - 1].y) + ' kg' : '—'}</h2></div>${delta(peso, 'kg', true)}</div>
      ${chartSVG(peso, 'kg')}</div>
    <div class="panel"><div class="row spread"><div><div class="eyebrow">Carga máxima</div><h2 class="num">${selEx ? fmtNum(porEx[selEx][porEx[selEx].length - 1].y) + ' kg' : '—'}</h2></div>${selEx ? delta(porEx[selEx], 'kg', false) : ''}</div>
      ${exIds.length ? `<select id="evo-ex" data-act-change="evo-ex" aria-label="Exercício do gráfico">${exIds.map(id => `<option value="${id}" ${id === selEx ? 'selected' : ''}>${esc(exById(id).nome)}</option>`).join('')}</select>${chartSVG(porEx[selEx], 'kg')}`
        : `<p class="muted small" style="margin:0">Registre sessões com carga para acompanhar a progressão.</p>`}</div>
  </div>
  <div class="panel">
    <div class="row spread"><h2>Medidas</h2><button class="btn primary sm" data-act="nova-medida" data-id="${a.id}">+ Nova avaliação</button></div>
    ${meds.length ? `<div class="table-wrap"><table class="num"><thead><tr><th>Data</th><th class="num">Peso kg</th><th class="num">% gordura</th><th class="num">Cintura cm</th><th class="num">Quadril cm</th><th class="num">Braço cm</th><th></th></tr></thead>
    <tbody>${meds.slice().reverse().map(m => `<tr><td>${fmtData(m.data)}</td><td class="num">${fmtNum(m.peso)}</td><td class="num">${fmtNum(m.gordura)}</td><td class="num">${fmtNum(m.cintura)}</td><td class="num">${fmtNum(m.quadril)}</td><td class="num">${fmtNum(m.braco)}</td>
    <td><button class="btn ghost sm danger" data-act="del-medida" data-id="${a.id}" data-medida="${m.id}" aria-label="Excluir avaliação de ${fmtData(m.data)}">Excluir</button></td></tr>`).join('')}</tbody></table></div>`
    : `<p class="muted" style="margin:0">Nenhuma avaliação ainda. Registre peso e medidas para acompanhar a evolução.</p>`}
  </div>`;
}

}

function openRegistrar(aid, tid) {
  const a = alunoById(aid), t = a.treinos.find(x => x.id === tid), ti = a.treinos.indexOf(t);
  openDialog(`<form id="f-sessao" data-id="${aid}" data-treino="${tid}" class="dlg" style="padding:0">
    <div><div class="eyebrow">${esc(a.nome)}</div><h2>Registrar Treino ${LETRAS[ti]}${t.nome ? ' · ' + esc(t.nome) : ''}</h2></div>
    <div class="form-grid"><label class="field">Data<input type="date" id="s-data" value="${hoje()}" required></label>
    <label class="field">PSE, esforço de 0 a 10<input type="number" min="0" max="10" id="s-rpe" class="num" placeholder="Ex.: 7"></label></div>
    <div>${t.itens.map((it, i) => { const ex = exById(it.exId); return `<div class="reg-row">
      <input type="checkbox" id="s-feito-${i}" checked aria-label="Feito">
      <label for="s-feito-${i}" class="meta" style="min-width:0"><b>${esc(ex ? ex.nome : '—')}</b><div class="small muted num">${esc(it.series)} × ${esc(it.reps)}${it.carga !== '' ? ' · ' + fmtNum(it.carga) + ' kg' : ''}</div></label>
      <label class="field">Carga kg<input type="number" step="0.5" id="s-carga-${i}" class="num" value="${esc(it.carga)}"></label>
      <label class="field">Reps<input type="text" id="s-reps-${i}" class="num" value="${esc(String(it.reps).split('-').pop())}"></label>
    </div>`; }).join('')}</div>
    <label class="field">Observações da sessão<textarea id="s-nota" placeholder="Dores, ajustes, como o aluno se sentiu…"></textarea></label>
    <label class="row small" style="gap:8px"><input type="checkbox" id="s-atualizar"> Atualizar as cargas do plano com as cargas de hoje</label>
    <div class="row" style="justify-content:end"><button type="button" class="btn ghost" data-act="close">Cancelar</button><button class="btn primary">Salvar sessão</button></div>
  </form>`);
}

function textoPlano(a) {
  const linhas = [`PLANO DE TREINO · ${a.nome}`];
  if (a.objetivo) linhas.push(`Objetivo: ${a.objetivo}`);
  a.treinos.forEach((t, ti) => {
    linhas.push('', `TREINO ${LETRAS[ti]}${t.nome ? ' · ' + t.nome : ''}`);
    t.itens.forEach((it, i) => {
      const ex = exById(it.exId); const yt = ex && ytParse(ex.url);
      const partes = [`${it.series}x${it.reps}`]; if (it.carga !== '' && it.carga != null) partes.push(`${fmtNum(it.carga)} kg`); if (it.descanso) partes.push(`descanso ${it.descanso}s`);
      linhas.push(`${i + 1}. ${ex ? ex.nome : '—'}: ${partes.join(' · ')}${it.obs ? ` (${it.obs})` : ''}`);
      if (yt) linhas.push(`   Vídeo: ${ytWatch(yt)}`);
    });
  });
  return linhas.join('\n');
}

/* ---------- Vista: exercícios ---------- */
function viewExercicios() {
  const q = ui.busca.toLowerCase();
  const lista = db.exercicios.filter(e => (!ui.grupo || e.grupo === ui.grupo) && (!q || e.nome.toLowerCase().includes(q)))
    .sort((x, y) => x.nome.localeCompare(y.nome, 'pt-BR'));
  const semVideo = db.exercicios.filter(e => !ytParse(e.url)).length;
  const grupos = [...new Set([...GRUPOS, ...db.exercicios.map(e => e.grupo).filter(Boolean)])];
  return `${bannerExemplo()}
  <div class="page-head"><div><div class="eyebrow num">${db.exercicios.length} exercícios${semVideo ? ` · ${semVideo} sem vídeo` : ''}</div><h1>Biblioteca de exercícios</h1></div>
  <button class="btn primary" data-act="novo-ex">+ Novo exercício</button></div>
  <div class="filters"><input type="search" id="busca" placeholder="Buscar exercício" value="${esc(ui.busca)}" aria-label="Buscar exercício">
    <select id="filtro-grupo" aria-label="Filtrar por grupo muscular"><option value="">Todos os grupos</option>${grupos.map(g => `<option ${g === ui.grupo ? 'selected' : ''}>${esc(g)}</option>`).join('')}</select></div>
  <div id="lib-list">${libList(lista)}</div>`;
}
function libList(lista) {
  if (!lista.length) return `<div class="panel empty">Nenhum exercício encontrado.</div>`;
  return `<div class="lib">${lista.map(e => {
    const yt = ytParse(e.url);
    const usos = db.alunos.reduce((s, a) => s + a.treinos.reduce((s2, t) => s2 + t.itens.filter(i => i.exId === e.id).length, 0), 0);
    return `<article class="ex-card">
      <button class="thumb" data-act="video" data-ex="${e.id}" aria-label="${yt ? 'Ver vídeo de ' : 'Adicionar vídeo a '}${esc(e.nome)}">
        ${yt ? `<img src="${ytThumb(yt.id)}" alt="" loading="lazy" onerror="this.remove()"><span class="ph">Vídeo do YouTube</span><span class="bigplay" style="z-index:1"><svg viewBox="0 0 12 12"><path d="M2 1l9 5-9 5z"/></svg></span>`
          : `<span class="ph">Sem vídeo<br>Toque para colar o link do YouTube</span>`}
      </button>
      <div class="ex-body"><div class="row spread"><span class="chip">${esc(e.grupo || 'Outro')}</span><button class="btn ghost sm" data-act="editar-ex" data-ex="${e.id}">Editar</button></div>
        <h3>${esc(e.nome)}</h3>${e.notas ? `<div class="small muted">${esc(e.notas)}</div>` : ''}
        <div class="small muted num">${usos ? `Em ${usos} ${usos === 1 ? 'plano' : 'planos'}` : 'Não usado em planos'}</div></div>
    </article>`;
  }).join('')}</div>`;
}
// a imagem fica por cima do placeholder quando carrega
const styleFix = document.createElement('style'); styleFix.textContent = '.thumb img{position:absolute;inset:0;z-index:1}'; document.head.appendChild(styleFix);

function openExForm(id, depois) {
  const e = id ? exById(id) : { nome: '', grupo: '', url: '', notas: '' };
  openDialog(`<form id="f-ex" data-id="${id || ''}" ${depois ? `data-depois='${esc(JSON.stringify(depois))}'` : ''} class="dlg" style="padding:0">
    <h2>${id ? 'Editar exercício' : 'Novo exercício'}</h2>
    <div class="form-grid">
      <label class="field wide">Link do YouTube<input type="url" id="e-url" value="${esc(e.url)}" placeholder="https://www.youtube.com/watch?v=… ou https://youtu.be/…" inputmode="url"></label>
      <div class="wide" id="e-preview">${previewHtml(e.url)}</div>
      <label class="field">Nome<input type="text" id="e-nome" required value="${esc(e.nome)}" placeholder="Ex.: Agachamento búlgaro"></label>
      <label class="field">Grupo muscular<select id="e-grupo">${GRUPOS.map(g => `<option ${g === (e.grupo || 'Pernas') ? 'selected' : ''}>${g}</option>`).join('')}</select></label>
      <label class="field wide">Dicas de execução (opcional)<textarea id="e-notas" placeholder="Ex.: manter coluna neutra, joelhos alinhados com a ponta dos pés">${esc(e.notas)}</textarea></label>
    </div>
    <div class="row spread">${id ? `<button type="button" class="btn danger" data-act="excluir-ex" data-ex="${id}">Excluir</button>` : '<span></span>'}
    <div class="row"><button type="button" class="btn ghost" data-act="close">Cancelar</button><button class="btn primary">Salvar</button></div></div>
  </form>`);
}
function previewHtml(url) {
  if (!String(url || '').trim()) return `<div class="small muted">Cole o link de um vídeo do YouTube (vídeo normal ou Shorts). Ele aparece aqui para você conferir.</div>`;
  const yt = ytParse(url);
  if (!yt) return `<div class="small" style="color:var(--danger)">Não reconheci esse link. Use um link do YouTube, como https://youtu.be/abc123XYZ90.</div>`;
  return `<div class="video-box"><iframe src="${ytEmbed(yt)}" title="Pré-visualização" allow="encrypted-media; picture-in-picture" allowfullscreen></iframe></div>
    <div class="small muted" style="margin-top:6px">Vídeo reconhecido <a href="${ytWatch(yt)}" target="_blank" rel="noopener">abrir no YouTube</a></div>`;
}

/* ---------- Vista: backup ---------- */
function viewBackup() {
  return `<div class="page-head"><div><div class="eyebrow">Seus dados</div><h1>Backup</h1></div></div>
  <div class="panel"><p style="margin:0;max-width:65ch">Os dados ficam salvos <b>neste navegador</b>, neste aparelho. Para passar para outro aparelho ou guardar uma cópia, copie o backup abaixo e cole no outro aparelho em “Restaurar”.</p></div>
  <div class="grid-2">
    <div class="panel"><h2>Copiar backup</h2><textarea class="share" id="bk-out" readonly>${esc(JSON.stringify(db))}</textarea>
      <div class="row"><button class="btn primary" data-act="copiar" data-src="bk-out">Copiar</button><button class="btn" data-act="baixar">Baixar arquivo</button></div></div>
    <div class="panel"><h2>Restaurar</h2><textarea class="share" id="bk-in" placeholder="Cole aqui o backup copiado"></textarea>
      <div class="row"><button class="btn primary" data-act="restaurar">Restaurar backup</button><label class="btn">Abrir arquivo<input type="file" id="bk-file" accept=".json,application/json" hidden></label></div>
      <p class="small muted" style="margin:0">Restaurar substitui todos os dados atuais deste aparelho.</p></div>
  </div>`;
}

/* ---------- Confirmação dentro da página ---------- */
function confirmar(msg, okLabel, fn) {
  openDialog(`<h2>${esc(msg)}</h2><p class="muted" style="margin:0">Não dá para desfazer.</p>
    <div class="row" style="justify-content:end"><button class="btn ghost" data-act="close">Cancelar</button><button class="btn primary" id="cf-ok" style="background:var(--danger);border-color:var(--danger)">${esc(okLabel)}</button></div>`);
  $('#cf-ok').onclick = () => { closeDialog(); fn(); };
}

/* ---------- Eventos ---------- */
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, a = b.dataset.id && alunoById(b.dataset.id) || (b.dataset.aluno && alunoById(b.dataset.aluno));
  const t = a && (b.dataset.treino) && a.treinos.find(x => x.id === b.dataset.treino);
  switch (act) {
    case 'close': closeDialog(); break;
    case 'limpar-exemplo':
      confirmar('Apagar os dados de exemplo?', 'Apagar exemplos', () => {
        db = { exemplo: false, alunos: [], exercicios: db.exercicios.map(e => ({ ...e })) }; save(); rerender(); toast('Pronto. A biblioteca de exercícios foi mantida.');
      }); break;
    case 'novo-aluno': openAlunoForm(); break;
    case 'editar-aluno': openAlunoForm(a.id); break;
    case 'excluir-aluno': {
      const id = b.dataset.id; closeDialog();
      confirmar(`Excluir ${alunoById(id).nome}?`, 'Excluir aluno', () => { db.alunos = db.alunos.filter(x => x.id !== id); save(); location.hash = 'alunos'; route(); });
      break; }
    case 'tab': ui.tab[a.id] = b.dataset.tab; rerender(); break;
    case 'add-treino': a.treinos.push({ id: uid(), nome: '', itens: [] }); save(); rerender(); break;
    case 'dup-treino': a.treinos.splice(a.treinos.indexOf(t) + 1, 0, { id: uid(), nome: t.nome ? t.nome + ' (cópia)' : '', itens: t.itens.map(i => ({ ...i, id: uid() })) }); save(); rerender(); break;
    case 'del-treino': confirmar(`Excluir o Treino ${LETRAS[a.treinos.indexOf(t)]}?`, 'Excluir treino', () => { a.treinos = a.treinos.filter(x => x !== t); save(); rerender(); }); break;
    case 'add-item': t.itens.push({ id: uid(), exId: '', series: 3, reps: '10-12', carga: '', descanso: 60, obs: '' }); save(); rerender();
      setTimeout(() => { const s = $(`#ex-${t.itens[t.itens.length - 1].id}`); if (s) s.focus(); }, 0); break;
    case 'del-item': t.itens = t.itens.filter(i => i.id !== b.dataset.item); save(); rerender(); break;
    case 'mover': { const i = t.itens.findIndex(x => x.id === b.dataset.item), j = i + (+b.dataset.dir); if (j < 0 || j >= t.itens.length) break; [t.itens[i], t.itens[j]] = [t.itens[j], t.itens[i]]; save(); rerender(); break; }
    case 'video': showVideo(b.dataset.ex); break;
    case 'registrar': openRegistrar(a.id, t.id); break;
    case 'del-sessao': confirmar('Excluir esta sessão?', 'Excluir sessão', () => { a.sessoes = a.sessoes.filter(s => s.id !== b.dataset.sessao); save(); rerender(); }); break;
    case 'nova-medida': openMedida(a.id); break;
    case 'del-medida': confirmar('Excluir esta avaliação?', 'Excluir', () => { a.medidas = a.medidas.filter(m => m.id !== b.dataset.medida); save(); rerender(); }); break;
    case 'compartilhar':
      openDialog(`<div class="row spread"><h2>Enviar plano ao aluno</h2><button class="btn ghost" data-act="close">Fechar</button></div>
        <p class="muted" style="margin:0">Copie e cole no WhatsApp ou e-mail. Os links dos vídeos vão juntos.</p>
        <textarea class="share" id="share-txt" readonly>${esc(textoPlano(a))}</textarea>
        <div class="row"><button class="btn primary" data-act="copiar" data-src="share-txt">Copiar texto</button></div>`); break;
    case 'novo-ex': openExForm(); break;
    case 'editar-ex': openExForm(b.dataset.ex); break;
    case 'excluir-ex': {
      const id = b.dataset.ex; closeDialog();
      confirmar(`Excluir “${exById(id).nome}”?`, 'Excluir exercício', () => {
        db.exercicios = db.exercicios.filter(e => e.id !== id);
        db.alunos.forEach(al => al.treinos.forEach(tr => { tr.itens = tr.itens.filter(i => i.exId !== id); }));
        save(); rerender();
      }); break; }
    case 'copiar': {
      const el = $('#' + b.dataset.src);
      const ok = () => toast('Copiado'), fall = () => { el.focus(); el.select(); toast('Selecionado. Use Ctrl+C / Copiar.'); };
      try { navigator.clipboard.writeText(el.value).then(ok, fall); } catch (e) { fall(); }
      break; }
    case 'baixar': {
      try {
        const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
        const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = `pt-example-backup-${hoje()}.json`;
        document.body.appendChild(link); link.click(); link.remove();
      } catch (e) { toast('Não foi possível baixar. Use Copiar.'); }
      break; }
    case 'restaurar': restaurar($('#bk-in').value); break;
  }
});

function restaurar(txt) {
  let novo;
  try { novo = JSON.parse(txt); } catch (e) { toast('Backup inválido. Confira se colou o texto inteiro.'); return; }
  if (!novo || !Array.isArray(novo.alunos) || !Array.isArray(novo.exercicios)) { toast('Esse texto não é um backup do PT example.'); return; }
  confirmar('Substituir todos os dados por este backup?', 'Restaurar', () => { db = novo; save(); location.hash = 'alunos'; route(); toast('Backup restaurado'); });
}

document.addEventListener('change', ev => {
  const el = ev.target;
  if (el.id === 'bk-file' && el.files[0]) { const r = new FileReader(); r.onload = () => restaurar(r.result); r.readAsText(el.files[0]); return; }
  if (el.id === 'filtro-grupo') { ui.grupo = el.value; $('#lib-list').innerHTML = $('#app') && viewExercicios().match(/<div id="lib-list">([\s\S]*)<\/div>$/)[1]; return; }
  if (el.id === 'evo-ex') { ui.exEvo = el.value; rerender(); return; }
  const k = el.dataset.edit; if (!k) return;
  const a = alunoById(el.dataset.aluno), t = a && a.treinos.find(x => x.id === el.dataset.treino); if (!t) return;
  if (k === 'treino-nome') { t.nome = el.value.trim(); save(); return; }
  const it = t.itens.find(i => i.id === el.dataset.item); if (!it) return;
  if (k === 'exId' && el.value === '__novo') { el.value = it.exId; openExForm(null, { aluno: a.id, treino: t.id, item: it.id }); return; }
  it[k] = el.type === 'number' ? (el.value === '' ? '' : +el.value) : el.value;
  save();
  if (k === 'exId') rerender();
});
document.addEventListener('input', ev => {
  const el = ev.target;
  if (el.id === 'busca') { ui.busca = el.value; const m = viewExercicios().match(/<div id="lib-list">([\s\S]*)<\/div>$/); $('#lib-list').innerHTML = m[1]; }
  if (el.id === 'e-url') {
    clearTimeout(el._t); el._t = setTimeout(() => { $('#e-preview').innerHTML = previewHtml(el.value); }, 350);
  }
});

document.addEventListener('submit', ev => {
  const f = ev.target; ev.preventDefault();
  const v = id => { const el = $('#' + id, f); return el ? el.value.trim() : ''; };
  const n = id => { const x = v(id); return x === '' ? '' : +x.replace(',', '.'); };
  if (f.id === 'f-aluno') {
    const dados = { nome: v('a-nome'), objetivo: v('a-objetivo'), telefone: v('a-tel'), inicio: v('a-inicio'), notas: v('a-notas') };
    if (!dados.nome) return;
    if (f.dataset.id) Object.assign(alunoById(f.dataset.id), dados);
    else { const novo = { id: uid(), ...dados, treinos: [], sessoes: [], medidas: [] }; db.alunos.push(novo); save(); closeDialog(); location.hash = 'aluno-' + novo.id; return; }
    save(); closeDialog(); rerender();
  }
  if (f.id === 'f-ex') {
    const url = v('e-url');
    if (url && !ytParse(url)) { toast('O link do YouTube não foi reconhecido'); $('#e-url', f).focus(); return; }
    const dados = { nome: v('e-nome'), grupo: v('e-grupo'), url, notas: v('e-notas') };
    if (!dados.nome) return;
    let id = f.dataset.id;
    if (id) Object.assign(exById(id), dados); else { id = uid(); db.exercicios.push({ id, ...dados }); }
    if (f.dataset.depois) {
      const d = JSON.parse(f.dataset.depois); const a = alunoById(d.aluno); const t = a && a.treinos.find(x => x.id === d.treino); const it = t && t.itens.find(i => i.id === d.item);
      if (it) it.exId = id;
    }
    save(); closeDialog(); rerender(); toast('Exercício salvo');
  }
  if (f.id === 'f-medida') {
    const a = alunoById(f.dataset.id);
    a.medidas.push({ id: uid(), data: v('m-data'), peso: n('m-peso'), gordura: n('m-gordura'), cintura: n('m-cintura'), quadril: n('m-quadril'), braco: n('m-braco') });
    save(); closeDialog(); rerender(); toast('Avaliação salva');
  }
  if (f.id === 'f-sessao') {
    const a = alunoById(f.dataset.id), t = a.treinos.find(x => x.id === f.dataset.treino);
    const itens = t.itens.map((it, i) => ({ exId: it.exId, carga: n('s-carga-' + i), reps: v('s-reps-' + i), feito: $('#s-feito-' + i, f).checked }));
    if ($('#s-atualizar', f).checked) itens.forEach((r, i) => { if (r.feito && r.carga !== '') t.itens[i].carga = r.carga; });
    const rpe = v('s-rpe');
    a.sessoes.push({ id: uid(), data: v('s-data'), treinoId: t.id, treinoNome: `Treino ${LETRAS[a.treinos.indexOf(t)]}${t.nome ? ' · ' + t.nome : ''}`, rpe, nota: v('s-nota'), itens });
    ui.tab[a.id] = 'sessoes'; save(); closeDialog(); rerender(); toast('Sessão registrada');
  }
});

route();
})();
</script>
</body>
</html>
