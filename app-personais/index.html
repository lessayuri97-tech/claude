<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Squad · Diagnóstico gratuito</title>
<meta name="description" content="Responda a 7 perguntas rápidas e receba o seu ponto de partida: treino, alimentação e próximos passos.">
<meta name="theme-color" content="#161616">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root { --bg:#161616; --card:#1f1f1e; --line:#33332f; --fg:#f5f4f2; --muted:#a8a6a0; --a:#e8ff3a; --a-ink:#161616; --ok:#7ddc9a; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: Barlow, system-ui, sans-serif; -webkit-text-size-adjust: 100%; }
body { min-height: 100vh; display: flex; flex-direction: column; }
.wrap { width: 100%; max-width: 560px; margin: 0 auto; padding: 20px 16px calc(32px + env(safe-area-inset-bottom)); flex: 1; }
.top { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
.mark { width: 38px; height: 38px; border-radius: 10px; background: var(--a); color: var(--a-ink); display: grid; place-items: center; font: 700 1.15rem 'Barlow Condensed', sans-serif; letter-spacing: .04em; }
.top b { font: 700 1.4rem 'Barlow Condensed', sans-serif; letter-spacing: .04em; text-transform: uppercase; }
.bar { height: 6px; background: var(--line); border-radius: 9px; overflow: hidden; margin-bottom: 8px; }
.bar i { display: block; height: 100%; width: 0; background: var(--a); transition: width .25s; }
.step { color: var(--muted); font-size: .9rem; margin-bottom: 18px; }
h1 { font: 700 2.3rem/1.05 'Barlow Condensed', sans-serif; text-transform: uppercase; margin: 0 0 10px; }
h1 span { color: var(--a); }
h2 { font: 700 1.8rem/1.1 'Barlow Condensed', sans-serif; margin: 0 0 16px; }
p { line-height: 1.5; margin: 0 0 14px; color: var(--muted); }
.opts { display: grid; gap: 10px; }
.opt, .btn { font: 600 1.05rem Barlow, sans-serif; color: var(--fg); background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; padding: 16px; text-align: left; cursor: pointer; min-height: 56px; width: 100%; text-decoration: none; display: block; }
.opt:active, .opt.on { border-color: var(--a); background: #2a2a1c; }
.opt small { display: block; color: var(--muted); font-weight: 400; margin-top: 2px; }
.btn.primary { background: var(--a); color: var(--a-ink); border-color: var(--a); text-align: center; font-weight: 700; }
.btn.ghost { text-align: center; }
.row { display: flex; gap: 10px; margin-top: 16px; }
.row > * { flex: 1; }
label { display: block; font-weight: 600; margin-bottom: 14px; }
input[type=text], input[type=tel] { width: 100%; font: 500 1.1rem Barlow, sans-serif; padding: 15px; margin-top: 6px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--card); color: var(--fg); }
input:focus { outline: 2px solid var(--a); outline-offset: 1px; }
.back { background: none; border: 0; color: var(--muted); font: 500 1rem Barlow; padding: 12px 0; cursor: pointer; }
.res { background: var(--card); border: 1.5px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
.res h3 { margin: 0 0 6px; font: 700 1.25rem 'Barlow Condensed', sans-serif; text-transform: uppercase; color: var(--a); letter-spacing: .03em; }
.res p { margin: 0; color: var(--fg); }
.perfil { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.chip { background: #2a2a1c; border: 1px solid var(--a); color: var(--a); border-radius: 99px; padding: 5px 12px; font-size: .9rem; font-weight: 600; }
.foot { text-align: center; color: var(--muted); font-size: .8rem; padding: 0 16px 24px; }
.foot a { color: var(--muted); }
.err { color: #ff8f8f; min-height: 1.2em; font-size: .95rem; }
@media (min-width: 700px) { h1 { font-size: 3rem; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span class="mark">SQ</span><b id="nome">Squad</b></div>
  <div id="tela"></div>
</div>
<div class="foot">Este diagnóstico é uma orientação geral e não substitui avaliação médica. · <a href="app">Já sou aluno</a> · <a href="produto">Sou personal</a></div>
<script src="config.js"></script>
<script>
(() => {
'use strict';
const CFG = Object.assign({ whatsapp: '', leadsPara: '' }, window.PT_SUPABASE || {});
const PERGUNTAS = [
  { k: 'objetivo', t: 'Qual é o seu objetivo principal?', o: [['Emagrecer', 'perder gordura e ganhar leveza'], ['Ganhar massa muscular', 'ficar mais forte e maior'], ['Definir e tonificar', 'mais forma, menos gordura'], ['Saúde e energia', 'sentir-me bem no dia a dia']] },
  { k: 'nivel', t: 'Qual é a sua experiência com treino?', o: [['Nunca treinei', ''], ['Parei há algum tempo', ''], ['Treino às vezes', ''], ['Treino com regularidade', '']] },
  { k: 'dias', t: 'Quantos dias por semana consegue treinar?', o: [['2 dias', ''], ['3 dias', ''], ['4 dias', ''], ['5 ou mais', '']] },
  { k: 'local', t: 'Onde prefere treinar?', o: [['No ginásio', ''], ['Em casa', 'com pouco material'], ['Ao ar livre', ''], ['Um pouco de tudo', '']] },
  { k: 'lesao', t: 'Tem alguma lesão ou limitação?', o: [['Nenhuma', ''], ['Joelho', ''], ['Costas', ''], ['Ombro', ''], ['Outra / tenho dúvidas', 'vamos falar sobre isso']] },
  { k: 'comida', t: 'Como está a sua alimentação?', o: [['Sem rotina', 'como o que aparece'], ['Tento, mas falho', ''], ['Razoável', ''], ['Bem organizada', '']] }
];
const R = {}; let i = 0;
const $ = s => document.querySelector(s);
const esc = v => String(v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const total = PERGUNTAS.length + 1;
const barra = n => `<div class="bar"><i style="width:${Math.round(n / total * 100)}%"></i></div><div class="step">Passo ${n} de ${total}</div>`;
function inicio() {
  $('#tela').innerHTML = `<h1>Descubra o seu <span>ponto de partida</span></h1>
    <p>Responda a ${total} perguntas rápidas (menos de 1 minuto). No fim recebe uma orientação para o seu treino e a sua alimentação, e pode falar diretamente com o personal.</p>
    <button class="btn primary" id="go">Começar o diagnóstico</button>`;
  $('#go').onclick = () => { i = 0; pergunta(); };
}
function pergunta() {
  const q = PERGUNTAS[i];
  $('#tela').innerHTML = `${barra(i + 1)}<h2>${q.t}</h2><div class="opts">${q.o.map((o, n) => `<button class="opt ${R[q.k] === o[0] ? 'on' : ''}" data-n="${n}">${o[0]}${o[1] ? `<small>${o[1]}</small>` : ''}</button>`).join('')}</div>
    <button class="back" id="volta">← Voltar</button>`;
  document.querySelectorAll('.opt').forEach(b => b.onclick = () => { R[q.k] = q.o[+b.dataset.n][0]; i++; i < PERGUNTAS.length ? pergunta() : contacto(); });
  $('#volta').onclick = () => { i--; i < 0 ? inicio() : pergunta(); };
}
function contacto() {
  $('#tela').innerHTML = `${barra(total)}<h2>Quase lá! Como o devemos chamar?</h2>
    <form id="f"><label>O seu nome<input type="text" id="n" autocomplete="name" required value="${esc(R.nome || '')}"></label>
    <label>O seu WhatsApp (com indicativo)<input type="tel" id="w" inputmode="tel" autocomplete="tel" placeholder="Ex.: 351912345678" required value="${esc(R.whatsapp || '')}"></label>
    <div class="err" id="e"></div><button class="btn primary">Ver o meu resultado</button></form>
    <button class="back" id="volta">← Voltar</button>`;
  $('#volta').onclick = () => { i = PERGUNTAS.length - 1; pergunta(); };
  $('#f').onsubmit = ev => { ev.preventDefault(); R.nome = $('#n').value.trim(); R.whatsapp = $('#w').value.trim();
    if (R.whatsapp.replace(/\D/g, '').length < 9) { $('#e').textContent = 'Confira o número: precisa do indicativo e de pelo menos 9 números.'; return; }
    guardaLead(); resultado(); };
}
function analise() {
  const d = parseInt(R.dias) || 3, novo = /Nunca|Parei/.test(R.nivel), obj = R.objetivo;
  const treino = novo ? `Comece com ${Math.min(d, 3)} treinos por semana de corpo inteiro, com cargas leves e muita atenção à técnica. Depois de 4 a 6 semanas sobe-se a carga e passa-se a dividir o treino.`
    : d >= 4 ? `Com ${d} dias por semana encaixa bem um treino dividido (ex.: superior e inferior), com progressão de carga semana a semana.` : `Com ${d} dias por semana, treinos de corpo inteiro bem planeados dão ótimos resultados.`;
  const comida = /Sem rotina|falho/.test(R.comida) ? 'O maior ganho está aqui: começar por 3 refeições com proteína, mais água, e um plano simples que consiga cumprir.' : 'Já tem uma base boa. Afinar calorias e proteína ao seu objetivo vai acelerar os resultados.';
  const foco = obj === 'Emagrecer' ? 'Défice calórico moderado, passos diários e treino de força para manter o músculo.' : obj === 'Ganhar massa muscular' ? 'Pequeno superávit calórico, proteína ao longo do dia e progressão de carga.' : obj === 'Definir e tonificar' ? 'Treino de força com boa intensidade e alimentação com proteína e calorias controladas.' : 'Constância, mobilidade e uma rotina de alimentação que lhe dê energia.';
  const cuidado = R.lesao === 'Nenhuma' ? '' : `Tem ${/Outra/.test(R.lesao) ? 'dúvidas sobre limitações' : 'uma limitação em ' + R.lesao.toLowerCase()}: o treino deve ser adaptado. Se tiver dor, procure primeiro um profissional de saúde.`;
  return { treino, comida, foco, cuidado };
}
function resultado() {
  const a = analise();
  const msg = `Olá! Fiz o diagnóstico da Squad.\nNome: ${R.nome}\nObjetivo: ${R.objetivo}\nExperiência: ${R.nivel}\nDias por semana: ${R.dias}\nLocal: ${R.local}\nLimitações: ${R.lesao}\nAlimentação: ${R.comida}\nQuero saber como começar!`;
  const wa = CFG.whatsapp ? `https://wa.me/${String(CFG.whatsapp).replace(/\D/g, '')}?text=${encodeURIComponent(msg)}` : '';
  $('#tela').innerHTML = `<div class="bar"><i style="width:100%"></i></div><h1>${esc(R.nome.split(' ')[0])}, <span>este é o seu ponto de partida</span></h1>
    <div class="perfil"><span class="chip">${esc(R.objetivo)}</span><span class="chip">${esc(R.dias)} por semana</span><span class="chip">${esc(R.local)}</span></div>
    <div class="res"><h3>Treino</h3><p>${esc(a.treino)}</p></div>
    <div class="res"><h3>Foco do seu objetivo</h3><p>${esc(a.foco)}</p></div>
    <div class="res"><h3>Alimentação</h3><p>${esc(a.comida)}</p></div>
    ${a.cuidado ? `<div class="res"><h3>Atenção</h3><p>${esc(a.cuidado)}</p></div>` : ''}
    <p>O próximo passo é ter um plano feito à sua medida, com treino e alimentação, e acompanhamento na app.</p>
    ${wa ? `<a class="btn primary" href="${wa}" target="_blank" rel="noopener">Falar com o personal no WhatsApp</a>` : `<div class="res"><p>Obrigado! Recebemos as suas respostas e o personal vai entrar em contacto consigo pelo número que indicou.</p></div>`}
    <div class="row"><button class="btn ghost" id="refaz">Refazer</button><a class="btn ghost" href="app">Abrir a app</a></div>`;
  $('#refaz').onclick = () => { Object.keys(R).forEach(k => delete R[k]); inicio(); };
}
async function guardaLead() {
  if (!CFG.url || !CFG.anonKey || !CFG.leadsPara) return;
  try { await fetch(CFG.url + '/rest/v1/leads', { method: 'POST', headers: { apikey: CFG.anonKey, Authorization: 'Bearer ' + CFG.anonKey, 'Content-Type': 'application/json', Prefer: 'return=minimal' }, body: JSON.stringify({ personal_id: CFG.leadsPara, nome: R.nome, whatsapp: R.whatsapp, respostas: R }) }); } catch (e) {}
}
inicio();
})();
</script>
</body>
</html>
