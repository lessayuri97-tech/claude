<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Squad · Diagnóstico gratuito</title>
<meta name="description" content="Responda ao diagnóstico e receba o seu ponto de partida: treino, alimentação e próximos passos.">
<meta name="theme-color" content="#EFF0EB">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap">
<style>
:root { --bg:#EFF0EB; --card:#ffffff; --line:#D9D4CB; --fg:#3C3E52; --muted:#6C6A72; --a:#34364D; --a-ink:#ffffff; --greige:#CDC9C0; --ok:#3f6b4f; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: 'Hanken Grotesk', system-ui, sans-serif; -webkit-text-size-adjust: 100%; }
body { min-height: 100vh; display: flex; flex-direction: column; }
.wrap { width: 100%; max-width: 560px; margin: 0 auto; padding: 20px 16px calc(32px + env(safe-area-inset-bottom)); flex: 1; }
.top { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
.mark { width: 44px; height: 44px; border-radius: 50%; background: var(--greige); color: #fff; display: grid; place-items: center; font: 600 1.05rem 'Plus Jakarta Sans', 'Hanken Grotesk', Arial, sans-serif; letter-spacing: .04em; }
.top b { font: 800 1.3rem 'Plus Jakarta Sans', 'Hanken Grotesk', Arial, sans-serif; letter-spacing: .18em; text-transform: uppercase; }
.bar { height: 6px; background: var(--line); border-radius: 9px; overflow: hidden; margin-bottom: 8px; }
.bar i { display: block; height: 100%; width: 0; background: var(--a); transition: width .25s; }
.step { color: var(--muted); font-size: .9rem; margin-bottom: 18px; }
h1 { font: 700 2.1rem/1.1 'Plus Jakarta Sans', 'Hanken Grotesk', Arial, sans-serif; margin: 0 0 10px; }
h1 span { color: var(--a); }
h2 { font: 700 1.5rem/1.15 'Plus Jakarta Sans', 'Hanken Grotesk', Arial, sans-serif; margin: 0 0 16px; }
p { line-height: 1.5; margin: 0 0 14px; color: var(--muted); }
.opts { display: grid; gap: 10px; }
.opt, .btn { font: 600 1.05rem 'Hanken Grotesk', sans-serif; color: var(--fg); background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; padding: 16px; text-align: left; cursor: pointer; min-height: 56px; width: 100%; text-decoration: none; display: block; }
.opt:active, .opt.on { border-color: var(--a); background: #E4E1EA; }
.opt small { display: block; color: var(--muted); font-weight: 400; margin-top: 2px; }
.btn.primary { background: var(--a); color: var(--a-ink); border-color: var(--a); text-align: center; font-weight: 700; }
.btn.ghost { text-align: center; }
.row { display: flex; gap: 10px; margin-top: 16px; }
.row > * { flex: 1; }
label { display: block; font-weight: 600; margin-bottom: 14px; }
.lab { font-weight: 600; }
#tel-host { margin-bottom: 14px; }
input[type=text], input[type=tel] { width: 100%; font: 500 1.1rem 'Hanken Grotesk', sans-serif; padding: 15px; margin-top: 6px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--card); color: var(--fg); }
input:focus { outline: 2px solid var(--a); outline-offset: 1px; }
.back { background: none; border: 0; color: var(--muted); font: 500 1rem 'Hanken Grotesk'; padding: 12px 0; cursor: pointer; }
.res { background: var(--card); border: 1.5px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
.res h3 { margin: 0 0 6px; font: 700 1.1rem 'Plus Jakarta Sans', 'Hanken Grotesk', Arial, sans-serif; color: var(--a); }
.res p { margin: 0; color: var(--fg); }
.perfil { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.chip { background: #E4E1EA; border: 1px solid #C9C5D6; color: var(--a); border-radius: 99px; padding: 5px 12px; font-size: .9rem; font-weight: 600; }
.foot { text-align: center; color: var(--muted); font-size: .8rem; padding: 0 16px 24px; }
.foot a { color: var(--muted); }
.err { color: #a3332d; min-height: 1.2em; font-size: .95rem; }
.tel { display: flex; gap: 8px; margin-top: 6px; position: relative; }
.tel input { margin-top: 0 !important; flex: 1; min-width: 0; }
.pais { display: flex; align-items: center; gap: 8px; background: var(--card); color: var(--fg); border: 1.5px solid var(--line); border-radius: 12px; padding: 0 12px; font: 600 1.05rem 'Hanken Grotesk'; cursor: pointer; min-height: 54px; }
.pais img, .lp img { width: 28px; height: 21px; object-fit: cover; border-radius: 3px; flex: none; box-shadow: 0 0 0 1px rgba(0,0,0,.12); }
.lista { position: absolute; z-index: 5; top: 60px; left: 0; right: 0; background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; max-height: 300px; overflow: auto; box-shadow: 0 10px 30px rgba(31,32,51,.2); }
.lista input { margin: 8px !important; width: calc(100% - 16px) !important; flex: none !important; }
.lp { display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px; background: none; border: 0; color: var(--fg); font: 500 1rem 'Hanken Grotesk'; text-align: left; cursor: pointer; }
.lp:hover, .lp:active { background: #E4E1EA; }
.lp span:last-child { margin-left: auto; color: var(--muted); }
/* Página de venda */
[hidden] { display: none !important; }
.entrar { margin-left: auto; border: 2px solid var(--a); color: var(--a); background: transparent; border-radius: 99px; padding: 10px 18px; font: 600 .98rem 'Hanken Grotesk', sans-serif; text-decoration: none; white-space: nowrap; }
.entrar:active, .entrar:hover { background: var(--a); color: #fff; }
@media (min-width: 700px) { h1 { font-size: 3rem; } }
.ctxt { font: 600 .72rem 'Plus Jakarta Sans', Arial, sans-serif; letter-spacing: .06em; white-space: nowrap; } .ctxt b { font-weight: 800; letter-spacing: .1em; } .logo { height: 34px; width: auto; display: block; }
.btn.primary::after { content: ' →'; font-weight: 400; }
.sub-q { margin: -6px 0 14px; color: var(--muted, #6b6d80); font-size: .95rem; }
#tela textarea { width: 100%; font: inherit; padding: 12px 14px; border: 1.5px solid var(--line, #CDC9C0); border-radius: 12px; background: #fff; color: inherit; resize: vertical; margin-bottom: 8px; }
#tela form input[type=text] { margin-bottom: 8px; }
.resp { margin: 16px 0 12px; padding: 14px 16px; border-radius: 14px; background: #e6e3da; border-left: 4px solid #34364D; font-size: 1.02rem; line-height: 1.5; animation: respIn .45s ease both; } .resp { cursor: pointer; } .rbar { height: 4px; border-radius: 99px; background: rgba(52,54,77,.15); margin: 12px 0 8px; overflow: hidden; } .rbar i { display: block; height: 100%; width: 0; background: #34364D; } .resp.pausa .rbar i { opacity: .45; } .rrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: #6b6d80; } .rnext { width: 44px; height: 44px; border-radius: 50%; border: 0; background: #34364D; color: #fff; font-size: 1.3rem; cursor: pointer; flex: none; } @keyframes respIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } } @media (prefers-reduced-motion: reduce) { .resp { animation: none; } }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="top"><img class="logo" src="logo-navy.png" alt="Squad"><span class="ctxt">| CONSULTORIA FITNESS</span><a class="entrar" href="app">Já tenho login</a></div>
  <div id="tela"></div>
</div>

<div class="foot">Este diagnóstico é uma orientação geral e não substitui avaliação médica. · <a href="app" style="opacity:.6">Equipe</a></div>
<script src="config.js"></script>
<script src="telefone.js"></script>
<script>
(() => {
'use strict';
const CFG = Object.assign({ whatsapp: '', leadsPara: '' }, window.PT_SUPABASE || {});
const PERGUNTAS = [
  { k: 'nome', t: 'Nome completo:', tipo: 'texto', ac: 'name', mt: r => `Prazer, ${esc((r.nome || '').split(' ')[0])}! 💛 Vamos te conhecer melhor para cuidar de você do jeito certo.` },
  { k: 'idade', t: 'Idade:', tipo: 'idade', mt: () => 'Obrigada! Cada fase da vida tem o seu ritmo, e o seu plano é pensado para o seu. 🌸' },
  { k: 'instagram', t: '@ do Instagram:', tipo: 'insta', mt: r => `Anotado, ${esc(r.instagram)}! Assim a nossa equipe também consegue te encontrar por lá. ✨` },
  { k: 'whatsapp', t: 'Telefone (com DDD):', tipo: 'tel', mt: () => 'Perfeito! É por aí que vamos te chamar, então fique de olho no seu WhatsApp. 💬' },
  { k: 'profissao', t: 'Profissão:', s: 'Se for estudante, qual curso?', tipo: 'texto', mt: () => 'Conhecer a sua rotina ajuda a montar um plano que cabe nela, e não o contrário. 🌿' },
  { k: 'objetivo', t: 'Objetivo:', o: ['Emagrecimento', 'Hipertrofia', 'Performance na corrida mantendo/ganhando massa magra', 'Apenas saúde e bem-estar'], m: ['Um objetivo muito comum e muito possível de trabalhar com estratégia. Vamos montar um caminho para o seu ritmo, sem pressa e sem terror. 💛', 'Ganhar força e massa com um plano de treino e alimentação bem organizados é o nosso dia a dia. Vamos construir isso passo a passo. 💪', 'Correr bem e manter a massa magra pede equilíbrio entre treino e alimentação, e é exatamente aí que podemos ajudar. 🏃‍♀️', 'Cuidar da saúde e do bem-estar já é uma decisão linda. Vamos juntas encontrar uma rotina que caiba na sua vida. 🌿'] },
  { k: 'desafio', t: 'Qual seu maior desafio hoje para alcançar esse objetivo?', s: 'Seja o mais detalhista possível.', tipo: 'longo', mt: 'Obrigada por abrir o jogo com a gente. Entender o que mais pesa na sua rotina é o primeiro passo para traçar um plano que funcione de verdade para você. Você não está sozinha nisso. 💛' },
  { k: 'acompanhamento', t: 'Já teve algum acompanhamento antes?', o: ['Sim, tive uma boa experiência', 'Sim, mas não tive uma boa experiência', 'Sim, apenas presencial', 'Não, nunca tive acompanhamento on-line'], m: ['Que bom que a experiência foi boa! Vamos construir sobre o que já funcionou para você. 💛', 'Obrigada por contar. Cada pessoa precisa de um jeito diferente de ser acompanhada, e queremos entender o que faltou para fazer diferente. 🤍', 'O presencial tem o seu valor. Aqui vamos te acompanhar de perto também, adaptado à sua rotina. 💪', 'Sem problema nenhum! Muitas alunas começaram assim, e vamos te explicar cada passo com calma. 🌸'] },
  { k: 'caneta', t: 'Já fez uso de canetas emagrecedoras?', o: ['Sim', 'Não', 'Ainda estou fazendo', 'Não, mas pretendo fazer'], m: ['Obrigada por compartilhar. Nós orientamos o treino e a alimentação, e o uso de qualquer medicação é sempre assunto para conversar com o seu médico. 💛', 'Tudo bem! Aqui o foco é construir hábitos de treino e alimentação que fazem sentido para você. 🌿', 'Obrigada por avisar. Esta informação nos ajuda a cuidar melhor de você, e o acompanhamento com o seu médico continua sendo essencial. 💛', 'Obrigada por contar. Qualquer decisão sobre medicação deve ser conversada com um profissional de saúde. Nós podemos ajudar com treino e alimentação. 🌿'] },
  { k: 'orcamento', t: 'Caso você fosse investir hoje em seu acompanhamento quanto estarias disposta para isso?', o: ['Entre R$200-250 mensais', 'Entre R$250-300 mensais', 'Entre R$300-400 mensais'], m: ['Obrigada pela transparência! Isso nos ajuda a pensar numa proposta que faça sentido para você. 💛', 'Obrigada pela transparência! Isso nos ajuda a pensar numa proposta que faça sentido para você. 💛', 'Obrigada pela transparência! Isso nos ajuda a pensar numa proposta que faça sentido para você. 💛'] },
  { k: 'momento', t: 'Qual momento você se encontra hoje em relação a buscar ajuda de um profissional para evoluir?', o: ['Ainda estou pesquisando e entendendo melhor meu caso', 'Tenho interesse, mas não sei se é o momento', 'Quero resolver isso logo e estou atrás de opções', 'Quero começar o quanto antes!'], m: ['Pesquisar com calma é importante. Estamos aqui para esclarecer o que precisar, sem pressão. 🌸', 'É normal ter essa dúvida. Muitas alunas começaram assim, e o primeiro passo pode ser pequeno. 💛', 'Boa! Vamos te ajudar a encontrar o melhor caminho para o seu momento. 💪', 'Adoramos essa energia! Vamos fazer o possível para você começar bem. 🚀'] },
  { k: 'videochamada', t: 'Caso você for selecionada para um diagnóstico gratuito via video chamada, se comprometeria em comparecer e estar cem por cento concentrada na chamada?', s: 'Não estar em horário de trabalho, dirigindo, da rua ou fazendo outra coisa.', o: ['Sim', 'Não'], m: ['Perfeito! Com você 100% presente a conversa rende muito mais, e vamos poder entender bem o seu caso. 💛', 'Sem problema. Conseguimos conversar melhor quando você está com a atenção toda na chamada, então se for selecionada combinamos o melhor momento. 🌸'] }
];
const R = {}; let i = 0, telC = null;
const $ = s => document.querySelector(s);
const esc = v => String(v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const total = PERGUNTAS.length;
const barra = n => `<div class="bar"><i style="width:${Math.round((n - 1) / total * 100)}%"></i></div><div class="step">Pergunta ${n} de ${total}</div>`;
function boasVindas() {
  limpaTimer(); window.scrollTo(0, 0);
  $('#tela').innerHTML = `<div class="bar"><i style="width:0%"></i></div>
    <h1>Seja bem-vinda ao <span>SQUAD!</span></h1>
    <p style="font-size:1.08rem"><b>Em poucos minutos, você vai responder algumas perguntas para entendermos melhor seu momento atual e como podemos ajudar.</b> Levamos nosso trabalho muito a <b>sério</b> — por isso, é de suma importância que sejas sincera em cada detalhe para que assim possamos <b>traçar juntos um plano estratégico</b> de evolução.</p>
    <button class="btn primary" id="comeca">Começar</button>
    `;
  $('#comeca').onclick = () => { i = 0; pergunta(); };
}
const instaLimpo = v => { v = v.trim().replace(/^(https?:\/\/)?(www\.)?instagram\.com\//i, '').replace(/[/?#].*$/, '').replace(/^@+/, '').replace(/\s+/g, ''); return v ? '@' + v : ''; };
function anterior() { limpaTimer(); i--; i < 0 ? boasVindas() : pergunta(); }
function proxima() { limpaTimer(); i++; i < PERGUNTAS.length ? pergunta() : concluir(); }
let tmr = null;
function limpaTimer() { if (tmr) { cancelAnimationFrame(tmr.raf); tmr = null; } }
function resp(msg) {
  limpaTimer();
  let c = $('#fb'); if (!c) { c = document.createElement('div'); c.id = 'fb'; $('#tela').insertBefore(c, $('#volta')); }
  c.innerHTML = `<div class="resp" id="rsp" role="status"><div class="rtxt">${msg}</div><div class="rbar"><i></i></div><div class="rrow"><span class="small" id="rdica">Toque na mensagem para pausar</span><button type="button" class="rnext" id="rnext" aria-label="Avançar para a próxima pergunta">→</button></div></div>`;
  const DUR = 10000, bar = c.querySelector('.rbar i'), t = tmr = { raf: 0 }; let falta = DUR, pausa = false, last = performance.now();
  const tick = now => { if (tmr !== t) return; if (!pausa) falta -= Math.min(250, now - last); last = now; bar.style.width = (100 - falta / DUR * 100) + '%'; if (falta <= 0) { limpaTimer(); proxima(); return; } t.raf = requestAnimationFrame(tick); };
  t.raf = requestAnimationFrame(tick);
  $('#rsp').onclick = e => { if (e.target.closest('#rnext')) return; pausa = !pausa; $('#rsp').classList.toggle('pausa', pausa); $('#rdica').textContent = pausa ? 'Em pausa. Toque de novo para continuar, ou use a seta.' : 'Toque na mensagem para pausar'; };
  $('#rnext').onclick = e => { e.stopPropagation(); limpaTimer(); proxima(); };
}
function pergunta() {
  limpaTimer();
  const q = PERGUNTAS[i], ultima = i === total - 1, cab = `${barra(i + 1)}<h2>${q.t}</h2>${q.s ? `<p class="sub-q">${q.s}</p>` : ''}`, volta = `<button class="back" id="volta" type="button">← Voltar</button>`;
  if (q.o) {
    $('#tela').innerHTML = `${cab}<div class="opts">${q.o.map((o, n) => `<button class="opt ${R[q.k] === o ? 'on' : ''}" data-n="${n}">${esc(o)}</button>`).join('')}</div>${volta}`;
    const escolhe = n => { R[q.k] = q.o[n]; document.querySelectorAll('.opt').forEach((x, k) => x.classList.toggle('on', k === n));
      if (ultima) { if (!R._salvo) { R._salvo = 1; guardaLead(); } document.querySelector('.opts').style.pointerEvents = 'none'; }
      resp(q.m[n]); };
    document.querySelectorAll('.opt').forEach(b => b.onclick = () => escolhe(+b.dataset.n));
    $('#volta').onclick = anterior; return;
  }
  const campo = q.tipo === 'tel' ? '<div id="tel-host"></div>'
    : q.tipo === 'longo' ? `<textarea id="v" rows="4" required>${esc(R[q.k] || '')}</textarea>`
    : `<input type="text" id="v" required value="${esc(R[q.k] || '')}" ${q.ac ? `autocomplete="${q.ac}"` : ''} ${q.tipo === 'idade' ? 'inputmode="numeric" maxlength="3"' : ''} ${q.tipo === 'insta' ? 'placeholder="@seuperfil" autocapitalize="none" autocorrect="off"' : ''}>`;
  $('#tela').innerHTML = `${cab}<form id="f">${campo}<div class="err" id="e"></div><button class="btn primary" id="ok">Responder</button></form>${volta}`;
  $('#volta').onclick = anterior;
  if (q.tipo === 'tel') telC = PTTel.criar($('#tel-host'), { valor: R.whatsapp || '' }); else { const e = $('#v'); setTimeout(() => e.focus({ preventScroll: true }), 50); }
  const mostra = () => { const f = $('#f'); $('#ok').style.display = 'none'; $('#e').textContent = ''; if (q.tipo === 'tel') $('#tel-host').style.pointerEvents = 'none'; else $('#v').readOnly = true; resp(typeof q.mt === 'function' ? q.mt(R) : q.mt); };
  $('#f').onsubmit = ev => { ev.preventDefault(); if ($('#fb')) return; const err = t => { $('#e').textContent = t; };
    if (q.tipo === 'tel') { if (!telC.get()) return err(telC.pais() === 'br' ? 'Confira o número: DDD + celular, ex.: (11) 98765-4321.' : 'Confira o número de telefone.'); R.whatsapp = telC.get(); R.pais = telC.pais(); R.tel = R.whatsapp; return mostra(); }
    let v = $('#v').value.trim(); if (!v) return err('Esta pergunta é obrigatória.');
    if (q.tipo === 'idade') { const n = parseInt(v, 10); if (!(n >= 12 && n <= 100) || !/^\d+$/.test(v)) return err('Escreva a sua idade em números.'); v = String(n); }
    if (q.tipo === 'insta') { v = instaLimpo(v); if (v.length < 2) return err('Escreva o seu @ do Instagram.'); }
    R[q.k] = v; mostra(); };
}
function concluir() { if (!R._salvo) { R._salvo = 1; guardaLead(); } resultado(); }
function resultado() {
  window.scrollTo(0, 0);
  const nome = esc((R.nome || '').split(' ')[0]);
  $('#tela').innerHTML = `<div class="bar"><i style="width:100%"></i></div>
    <div style="text-align:center;padding:24px 0">
    <img class="logo" src="logo-navy.png" alt="Squad" style="height:44px;margin:0 auto 22px;display:block">
    <h1>Obrigado por chegar até aqui${nome ? ', ' + nome : ''}!<br><span>Você deu o primeiro passo.</span></h1>
    <p style="font-size:1.1rem;max-width:460px;margin:0 auto 14px">Fique atenta ao WhatsApp que em breve entraremos em contato com você caso seja selecionada.</p>
    <p style="font-size:1.1rem;max-width:460px;margin:0 auto"><b>Obrigada pela confiança. Estamos juntas!</b></p></div>`;
}
async function guardaLead() {
  if (!CFG.url || !CFG.anonKey || !CFG.leadsPara) return;
  try { await fetch(CFG.url + '/rest/v1/leads', { method: 'POST', headers: Object.assign({ apikey: CFG.anonKey, 'Content-Type': 'application/json', Prefer: 'return=minimal' }, /^eyJ/.test(CFG.anonKey) ? { Authorization: 'Bearer ' + CFG.anonKey } : {}), body: JSON.stringify({ personal_id: CFG.leadsPara, nome: R.nome, whatsapp: R.whatsapp, respostas: Object.fromEntries(Object.entries(R).filter(([k]) => k[0] !== '_')) }) }).then(r => { if (!r.ok) r.text().then(t => console.warn('lead não gravado', r.status, t)); }); } catch (e) { console.warn('lead não gravado', e); }
}
boasVindas();
})();
</script>
</body>
</html>
