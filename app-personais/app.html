<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PT example</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1c1b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PT example">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: barra superior fixa + coluna única de conteúdo (máx. 1040px); fichas de treino em linhas tipo planilha que viram cartões no celular */
:root {
  --bg: #f5f4f2;
  --surface: #ffffff;
  --surface-2: #eceae7;
  --line: #dcdad5;
  --fg: #1c1c1b;
  --muted: #6b6a66;
  --accent: #262625;
  --accent-ink: #ffffff;
  --accent-soft: #e8e6e2;
  --ok: #3f6b4f;
  --ok-soft: #e1ebe3;
  --danger: #a3332d;
  --danger-soft: #f5e1df;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Barlow", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141414; --surface: #1c1c1b; --surface-2: #262625; --line: #353533;
    --fg: #ecebe8; --muted: #a09e99; --accent: #e8e6e2; --accent-ink: #161616; --accent-soft: #2e2e2c;
    --ok: #8fc29f; --ok-soft: #22302a; --danger: #e8877f; --danger-soft: #3a2220;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141414; --surface: #1c1c1b; --surface-2: #262625; --line: #353533;
  --fg: #ecebe8; --muted: #a09e99; --accent: #e8e6e2; --accent-ink: #161616; --accent-soft: #2e2e2c;
  --ok: #8fc29f; --ok-soft: #22302a; --danger: #e8877f; --danger-soft: #3a2220;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; letter-spacing: .01em; line-height: 1.1; margin: 0; text-wrap: balance; }
h1 { font-size: 2rem; }
h2 { font-size: 1.5rem; }
h3 { font-size: 1.2rem; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.eyebrow { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }

/* Barra superior */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.topbar .wrap { display: flex; align-items: center; gap: 16px; padding-block: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--fg); }
.brand-mark { width: 34px; height: 34px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; }
.brand-mark svg { width: 22px; height: 22px; }
.brand b { font-family: var(--font-display); font-size: 1.45rem; letter-spacing: .02em; }
.nav { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
.nav a { text-decoration: none; color: var(--muted); font-weight: 600; padding: 6px 12px; border-radius: 999px; }
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.nav a:hover { color: var(--fg); }

main.wrap { padding-block: 24px 64px; display: grid; gap: 20px; }

/* Botões e campos */
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 7px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; text-decoration: none; color: var(--fg); white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--fg); background: var(--surface-2); }
.btn.danger { color: var(--danger); }
.btn.sm { padding: 4px 10px; font-size: .85rem; }
.btn.icon { padding: 6px; width: 32px; height: 32px; justify-content: center; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spread { justify-content: space-between; }
label.field { display: grid; gap: 4px; font-size: .85rem; color: var(--muted); font-weight: 600; min-width: 0; }
input[type=text], input[type=url], input[type=tel], input[type=password], input[type=date], input[type=number], input[type=search], select, textarea {
  width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; color: var(--fg); font-weight: 400; font-size: .95rem; min-width: 0;
}
textarea { resize: vertical; min-height: 64px; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.form-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
.form-grid .wide { grid-column: 1 / -1; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: grid; gap: 14px; min-width: 0; }
.chip { display: inline-block; font-size: .75rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.chip.accent { background: var(--accent-soft); color: var(--accent); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.banner { background: var(--accent-soft); color: var(--fg); border-radius: var(--radius); padding: 10px 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: .9rem; }
.banner .btn { margin-left: auto; }
.empty { text-align: center; padding: 28px 16px; color: var(--muted); display: grid; gap: 10px; justify-items: center; }

/* Lista de alunos */
.page-head { display: flex; gap: 12px; align-items: end; flex-wrap: wrap; justify-content: space-between; }
.cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.card-aluno { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 10px; text-decoration: none; color: var(--fg); }
.card-aluno:hover { border-color: var(--accent); }
.card-aluno .top { display: flex; gap: 12px; align-items: center; }
.avatar-ini { width: 42px; height: 42px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; color: var(--muted); flex: none; }
.card-aluno h3 { font-size: 1.25rem; }
.stats { display: flex; gap: 16px; flex-wrap: wrap; font-size: .85rem; color: var(--muted); }
.stats b { color: var(--fg); font-weight: 600; }

/* Detalhe do aluno */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 10px 16px; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }

/* Ficha de treino */
.treino { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.treino-head { display: flex; gap: 10px; align-items: center; padding: 12px 14px; background: var(--surface-2); flex-wrap: wrap; }
.treino-letter { font-family: var(--font-display); font-size: 1.4rem; font-weight: 700; width: 36px; height: 36px; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); border-radius: 8px; flex: none; }
.treino-head input { max-width: 320px; font-weight: 600; }
.treino-head .row { margin-left: auto; }
.ficha-cols, .ficha-row { display: grid; grid-template-columns: 28px minmax(0, 2.4fr) 70px 80px 80px 80px minmax(0, 1.4fr) 80px; gap: 8px; align-items: center; padding: 8px 14px; }
.ficha-cols { font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--line); }
.ficha-row { border-bottom: 1px solid var(--line); }
.ficha-row:last-child { border-bottom: 0; }
.ficha-row .ord { font-family: var(--font-display); font-weight: 700; color: var(--muted); font-size: 1.1rem; }
.ficha-row input, .ficha-row select { padding: 6px 8px; font-size: .9rem; }
.ex-cell { display: flex; gap: 8px; align-items: center; min-width: 0; }
.ex-cell select { flex: 1; }
.play { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); cursor: pointer; display: grid; place-items: center; }
.play svg { width: 12px; height: 12px; margin-left: 2px; }
.play.novideo { background: transparent; color: var(--muted); border: 1.5px dashed var(--line); }
.play[disabled] { background: var(--surface-2); color: var(--muted); cursor: default; }
.ficha-actions { display: flex; gap: 2px; justify-content: end; }
.treino-foot { padding: 10px 14px; display: flex; gap: 8px; flex-wrap: wrap; }
.m-label { display: none; }

/* Biblioteca de exercícios */
.lib { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.ex-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; display: grid; grid-template-rows: auto 1fr; }
.thumb { position: relative; aspect-ratio: 16 / 9; max-width: 100%; background: var(--surface-2); border: 0; padding: 0; cursor: pointer; display: block; width: 100%; overflow: hidden; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb .ph { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: .85rem; text-align: center; padding: 12px; }
.thumb .bigplay { position: absolute; inset: 0; margin: auto; width: 52px; height: 36px; border-radius: 10px; background: rgba(20, 20, 20, .78); display: grid; place-items: center; }
.thumb .bigplay svg { width: 16px; height: 16px; fill: #fff; margin-left: 3px; }
.thumb[disabled] { cursor: default; }
.ex-body { padding: 12px 14px; display: grid; gap: 6px; align-content: start; }
.ex-body h3 { font-size: 1.15rem; }
.filters { display: flex; gap: 10px; flex-wrap: wrap; }
.filters input { max-width: 280px; }
.filters select { max-width: 200px; }

/* Sessões e medidas */
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
td.num, th.num { text-align: right; }
.sessao { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 6px; background: var(--surface); }
.sessao ul { margin: 0; padding-left: 18px; font-size: .9rem; }
.reg-ex { padding: 12px 0; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.reg-ex:last-child { border-bottom: 0; }
.reg-ex .head { display: flex; gap: 10px; align-items: center; }
.reg-ex .head input { width: 20px; height: 20px; flex: none; }
.sets { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; padding-left: 30px; }
.set { display: grid; grid-template-columns: 24px minmax(0, 1fr) 12px minmax(0, .8fr); gap: 4px; align-items: center; background: var(--surface-2); border-radius: 8px; padding: 6px 8px; }
.set b { font-family: var(--font-display); color: var(--muted); }
.set input { padding: 5px 6px; text-align: right; }
.set input::-webkit-inner-spin-button, .set input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.set input[type=number] { -moz-appearance: textfield; appearance: textfield; }
.set .x { color: var(--muted); text-align: center; font-size: .85rem; }
.set-legend { padding-left: 30px; font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
.reg-ex.off .sets { opacity: .45; }
.kg-up { color: var(--ok); font-weight: 600; }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font-body); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .line { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.chart .area { fill: var(--accent-soft); stroke: none; }
.chart .dot { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }
.chart .dot.last { fill: var(--accent); }
.grid-2 { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.grid-2 > * { min-width: 0; }

/* Modal */
dialog { border: 0; border-radius: 14px; padding: 0; background: var(--surface); color: var(--fg); width: min(760px, calc(100vw - 32px)); max-height: calc(100vh - 48px); box-shadow: 0 24px 60px rgba(0, 0, 0, .35); }
dialog::backdrop { background: rgba(10, 15, 25, .6); }
.dlg { display: grid; gap: 14px; padding: 18px; }
.video-box { position: relative; aspect-ratio: 16 / 9; max-width: 100%; background: #000; border-radius: 8px; overflow: hidden; }
.video-box iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.tabbar { display: none; }
.video-aviso { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 8px; text-align: center; padding: 16px; background: var(--surface-2); color: var(--fg); }
.video-aviso span { font-size: .85rem; color: var(--muted); }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-weight: 600; z-index: 50; font-size: .9rem; }
textarea.share { min-height: 260px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .82rem; }

@media (max-width: 760px) {
  body { font-size: 16px; }
  .topbar .nav { display: none; }
  .topbar .wrap { padding-block: 8px; }
  main.wrap { padding-block: 16px calc(96px + env(safe-area-inset-bottom, 0px)); gap: 16px; }
  .tabbar { display: grid; grid-template-columns: repeat(3, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line);
    padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
  .tabbar a { display: grid; justify-items: center; gap: 2px; padding: 6px 0; text-decoration: none; color: var(--muted); font-size: .72rem; font-weight: 600; border-radius: 10px; }
  .tabbar svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .tabbar a[aria-current="page"] { color: var(--fg); background: var(--accent-soft); }
  .toast { bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
  input[type=text], input[type=url], input[type=tel], input[type=password], input[type=date], input[type=number], input[type=search], select, textarea { font-size: 16px; min-height: 44px; }
  .ficha-row input, .ficha-row select { min-height: 42px; font-size: 16px; }
  .set input { min-height: 40px; font-size: 16px; }
  .btn { padding: 10px 16px; min-height: 44px; }
  .btn.sm { padding: 8px 12px; min-height: 38px; font-size: .9rem; }
  .btn.icon { width: 40px; height: 40px; min-height: 40px; }
  .play { width: 40px; height: 40px; }
  .page-head .btn.primary[data-act^=novo] { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 24; border-radius: 999px; box-shadow: 0 10px 24px rgba(0, 0, 0, .25); padding: 12px 20px; }
  dialog { width: 100vw; max-width: 100vw; max-height: 92vh; margin: auto 0 0; border-radius: 18px 18px 0 0; }
  .dlg { padding: 18px max(16px, env(safe-area-inset-left, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)); }
  .cards { grid-template-columns: minmax(0, 1fr); }
  .lib { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .ex-body { padding: 10px; }
  .ex-body h3 { font-size: 1.05rem; }
  .filters input, .filters select { max-width: none; flex: 1 1 140px; }
  .tabs { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 52px); background: var(--bg); z-index: 15; }
  .tabs button { flex: 1; padding: 12px 8px; }
  .banner-txt { display: none; }
  .banner { padding: 8px 10px; }
  h1 { font-size: 1.7rem; }
  .ficha-cols { display: none; }
  .ficha-row { grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 12px 14px; row-gap: 8px; }
  .ficha-row .ord { display: none; }
  .ficha-row .ex-cell { grid-column: 1 / -1; }
  .ficha-row .obs { grid-column: 1 / -1; }
  .ficha-row .ficha-actions { grid-column: 1 / -1; justify-content: start; }
  .m-label { display: block; font-size: .7rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
  .sets, .set-legend { padding-left: 0; }
  .set { grid-template-columns: 16px minmax(0, 1.2fr) 10px minmax(0, .8fr); padding: 6px; }
  .set input { padding: 5px 4px; }
  .treino-head input { max-width: none; flex: 1; }
  .treino-head .row { margin-left: 0; }
}

/* ---------- Área do aluno ---------- */
.tabbar-aluno { display: none; }
body.modo-aluno .topbar .nav, body.modo-aluno .tabbar { display: none !important; }
body.modo-aluno main.wrap { max-width: 600px; padding-block: 12px calc(100px + env(safe-area-inset-bottom, 0px)); gap: 14px; }
body.modo-aluno .tabbar-aluno { display: grid; grid-template-columns: repeat(4, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.tabbar-aluno a { display: grid; justify-items: center; gap: 2px; padding: 6px 0; text-decoration: none; color: var(--muted); font-size: .72rem; font-weight: 600; border-radius: 10px; max-width: 140px; width: 100%; margin: 0 auto; }
.tabbar-aluno svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tabbar-aluno a.on { color: var(--fg); background: var(--accent-soft); }
body.modo-aluno [data-act=del-medida], body.modo-aluno [data-act=del-sessao] { display: none; }
body.modo-aluno .toast { bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
.aluno-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: var(--accent-soft); border-radius: var(--radius); padding: 8px 10px; }
.aluno-bar .btn { margin-left: auto; }
.ola h1 { font-size: 2.1rem; }
.ola .eyebrow::first-letter { text-transform: uppercase; }
.semana { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.dia { display: grid; justify-items: center; gap: 2px; padding: 8px 0; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); font-size: .75rem; color: var(--muted); }
.dia b { font-size: 1rem; color: var(--fg); }
.dia i { width: 6px; height: 6px; border-radius: 50%; background: transparent; }
.dia.feito i { background: var(--fg); }
.dia.hoje { border-color: var(--fg); }
.hoje-card { display: grid; gap: 8px; text-decoration: none; color: var(--accent-ink); background: var(--accent); border-radius: 16px; padding: 20px; }
.hoje-card .eyebrow { color: inherit; opacity: .7; }
.hoje-card h2 { font-size: 1.8rem; }
.hoje-card .btn { justify-self: start; background: var(--accent-ink); color: var(--accent); border-color: var(--accent-ink); margin-top: 6px; }
.mini-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.mini-stats > div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 2px; }
.mini-stats b { font-family: var(--font-display); font-size: 1.6rem; line-height: 1; }

  background: var(--fg); color: var(--bg); border-radius: 14px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; box-shadow: 0 12px 30px rgba(0, 0, 0, .3); }

<script>
(() => {
'use strict';

/* ---------- Armazenamento ---------- */
const KEY = 'pt-example:v1';
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const hoje = () => new Date().toISOString().slice(0, 10);
const diasAtras = n => { const d = new Date(); d.setDate(d.getDate() - n); return d.toISOString().slice(0, 10); };

function exemplo() {
  const ex = [
    ['Agachamento livre', 'Pernas'], ['Leg press 45°', 'Pernas'], ['Cadeira extensora', 'Pernas'], ['Mesa flexora', 'Pernas'],
    ['Supino reto com barra', 'Peito'], ['Supino inclinado com halteres', 'Peito'], ['Puxada frontal', 'Costas'], ['Remada baixa', 'Costas'],
    ['Desenvolvimento com halteres', 'Ombros'], ['Elevação lateral', 'Ombros'], ['Rosca direta', 'Braços'], ['Tríceps na polia', 'Braços'],
    ['Prancha', 'Core'], ['Elevação pélvica', 'Glúteos']
  ].map(([nome, grupo]) => ({ id: uid(), nome, grupo, url: '', notas: '' }));
  const E = n => ex.find(e => e.nome === n).id;
  const item = (n, series, reps, carga, descanso, obs = '') => ({ id: uid(), exId: E(n), series, reps, carga, descanso, obs });
  const tA = { id: uid(), nome: 'Inferiores', itens: [
    item('Agachamento livre', 4, '8-10', 60, 90, 'Descer até 90°'),
    item('Leg press 45°', 4, '10-12', 180, 90),
    item('Cadeira extensora', 3, '12', 45, 60),
    item('Mesa flexora', 3, '12', 35, 60),
    item('Elevação pélvica', 3, '12', 80, 60)
  ]};
  const tB = { id: uid(), nome: 'Superiores', itens: [
    item('Supino reto com barra', 4, '8-10', 50, 90),
    item('Puxada frontal', 4, '10', 55, 90),
    item('Desenvolvimento com halteres', 3, '10', 14, 60, 'Carga por halter'),
    item('Remada baixa', 3, '12', 50, 60),
    item('Tríceps na polia', 3, '12', 25, 45),
    item('Rosca direta', 3, '12', 20, 45)
  ]};
  const sessoes = [];
  [26, 21, 16, 12, 7, 2].forEach((d, i) => {
    const t = i % 2 ? tB : tA;
    sessoes.push({ id: uid(), data: diasAtras(d), treinoId: t.id, treinoNome: (t === tA ? 'Treino A · ' : 'Treino B · ') + t.nome, rpe: 7 + (i % 3 === 0 ? 1 : 0), nota: i === 4 ? 'Reclamou de dor leve no joelho direito' : '',
      itens: t.itens.map(it => { const c = +it.carga + Math.floor(i / 2) * 2.5, r = it.reps.split('-').pop();
        return { exId: it.exId, carga: c, reps: r, feito: true, series: Array.from({ length: it.series }, (_, k) => ({ carga: k === it.series - 1 && i % 2 ? c - 2.5 : c, reps: k === it.series - 1 ? String(Math.max(+r - 2, 1)) : r })) }; }) });
  });
  const medidas = [[28, 82.4, 24.1, 92], [14, 81.3, 23.4, 90.5], [1, 80.6, 22.8, 89]].map(([d, peso, gordura, cintura]) => ({ id: uid(), data: diasAtras(d), peso, gordura, cintura, quadril: '', braco: '' }));
  const tC = { id: uid(), nome: 'Full body', itens: [
    item('Leg press 45°', 3, '12-15', 120, 60),
    item('Puxada frontal', 3, '12', 40, 60),
    item('Supino inclinado com halteres', 3, '12', 12, 60, 'Carga por halter'),
    item('Elevação lateral', 3, '15', 6, 45),
    item('Prancha', 3, '30s', '', 45, 'Tempo em segundos')
  ]};
  const sessC = [15, 11, 8, 4, 1].map((d, i) => ({ id: uid(), data: diasAtras(d), treinoId: tC.id, treinoNome: 'Treino A · Full body', rpe: 6 + (i > 2 ? 1 : 0), nota: '',
    itens: tC.itens.map(it => { const c = it.carga === '' ? '' : +it.carga + (it.carga > 50 ? i * 5 : Math.floor(i / 2) * 1), r = it.reps.split('-')[0];
      return { exId: it.exId, carga: c, reps: r, feito: !(i === 2 && it === tC.itens[3]), series: Array.from({ length: it.series }, () => ({ carga: c, reps: r })) }; }) }));
  const medC = [[17, 96.8, 31.5, 108], [10, 95.1, 30.9, 106], [2, 93.9, 30.2, 104.5]].map(([d, peso, gordura, cintura]) => ({ id: uid(), data: diasAtras(d), peso, gordura, cintura, quadril: '', braco: '' }));
  return {
    exemplo: true,
    exercicios: ex,
    alunos: [
      { id: uid(), nome: 'Mariana Ribeiro', objetivo: 'Hipertrofia', telefone: '(11) 98765-4321', inicio: diasAtras(30), notas: 'Treina 4x por semana, de manhã.', treinos: [tA, tB], sessoes, medidas },
      { id: uid(), nome: 'Carlos Lima', objetivo: 'Emagrecimento', telefone: '(21) 99123-4567', inicio: diasAtras(18), notas: 'Hérnia de disco L5 (liberado pelo médico). Evitar carga axial alta.', treinos: [tC], sessoes: sessC, medidas: medC },
      { id: uid(), nome: 'Ana Costa', objetivo: 'Condicionamento', telefone: '', inicio: diasAtras(3), notas: '', treinos: [], sessoes: [], medidas: [] }
    ]
  };
}

let db;
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) { db = JSON.parse(raw); return; } } catch (e) {}
  db = exemplo();
}
function migra() { if (db.exemplo) db.alunos.forEach(a => { if (a.nome === 'Mariana Souza') a.nome = 'Mariana Ribeiro'; }); }
const SYNCKEY = KEY + ':sync';
let sync = { rev: 0, dirty: false, v: 0, status: 'inicio' }; // status: inicio | ativa | desligada | erro
try { const r = JSON.parse(localStorage.getItem(SYNCKEY) || 'null'); if (r) { sync.rev = r.rev || 0; sync.dirty = !!r.dirty; } } catch (e) {}
function saveSync() { try { localStorage.setItem(SYNCKEY, JSON.stringify({ rev: sync.rev, dirty: sync.dirty })); } catch (e) {} }
function saveLocal() { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} }
function save() { saveLocal(); sync.v++; sync.dirty = true; saveSync(); agendaPush(); }
load(); migra(); saveLocal();

/* ---------- Utilidades ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtData = iso => { if (!iso) return ''; const [y, m, d] = iso.split('-'); return `${d}/${m}/${y}`; };
const fmtNum = n => (n === '' || n == null || isNaN(n)) ? '' : (+n).toLocaleString('pt-BR', { maximumFractionDigits: 1 });
const iniciais = nome => nome.trim().split(/\s+/).filter(Boolean).map(p => p[0]).slice(0, 2).join('').toUpperCase();
const LETRAS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const GRUPOS = ['Pernas', 'Glúteos', 'Peito', 'Costas', 'Ombros', 'Braços', 'Core', 'Cardio', 'Mobilidade', 'Outro'];
const exById = id => db.exercicios.find(e => e.id === id);
const alunoById = id => db.alunos.find(a => a.id === id);

function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; t.setAttribute('role', 'status');
  document.body.appendChild(t); setTimeout(() => t.remove(), 2200);
}

/* Aceita: youtube.com/watch?v=ID, youtu.be/ID, /shorts/ID, /embed/ID, /live/ID, m.youtube.com, ou só o ID */
function ytParse(url) {
  const s = String(url || '').trim();
  if (!s) return null;
  const m = s.match(/(?:youtube(?:-nocookie)?\.com\/(?:watch\?(?:[^#]*&)?v=|embed\/|shorts\/|live\/|v\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);
  const id = m ? m[1] : (/^[A-Za-z0-9_-]{11}$/.test(s) ? s : null);
  if (!id) return null;
  let start = 0;
  const t = s.match(/[?&#](?:t|start)=(?:(\d+)h)?(?:(\d+)m)?(\d+)?s?/);
  if (t) start = (+(t[1] || 0)) * 3600 + (+(t[2] || 0)) * 60 + (+(t[3] || 0));
  return { id, start };
}
const ytThumb = id => `https://i.ytimg.com/vi/${id}/hqdefault.jpg`;
const ytWatch = yt => `https://www.youtube.com/watch?v=${yt.id}${yt.start ? '&t=' + yt.start + 's' : ''}`;
const ytEmbed = (yt, auto) => `https://www.youtube-nocookie.com/embed/${yt.id}?rel=0&modestbranding=1${yt.start ? '&start=' + yt.start : ''}${auto ? '&autoplay=1&playsinline=1&enablejsapi=1' + (/^https?:$/.test(location.protocol) ? '&origin=' + encodeURIComponent(location.origin) : '') : ''}`;
/* Player no próprio lugar: o iframe é criado no toque do utilizador, por isso o iOS deixa tocar logo (autoplay + playsinline) */
const playerHtml = (ex, yt) => `<div class="video-box"><iframe src="${ytEmbed(yt, true)}" data-yt="${yt.id}" data-start="${yt.start || 0}" title="${esc(ex.nome)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen; clipboard-write" allowfullscreen></iframe></div>`;
function avisoVideo(box, id, start) {
  if (!box) return;
  const url = `https://www.youtube.com/watch?v=${id}${+start ? '&t=' + start + 's' : ''}`;
  box.innerHTML = `<div class="video-aviso"><b>Este vídeo não pode ser reproduzido aqui.</b><span>O dono do vídeo bloqueou a reprodução em outros sites.</span><a class="btn sm" href="${url}" target="_blank" rel="noopener">Ver no YouTube</a></div>`;
}
document.addEventListener('load', e => { // liga a escuta de erros do player do YouTube
  const f = e.target; if (!f || f.tagName !== 'IFRAME' || !f.dataset.yt) return;
  try { f.contentWindow.postMessage(JSON.stringify({ event: 'listening', id: 1, channel: 'widget' }), '*'); } catch (err) {}
}, true);
window.addEventListener('message', ev => {
  let host = ''; try { host = new URL(ev.origin).hostname; } catch (e) { return; }
  if (!/(^|\.)youtube(-nocookie)?\.com$/.test(host)) return;
  let d = ev.data; if (typeof d === 'string') { try { d = JSON.parse(d); } catch (e) { return; } }
  if (!d || d.event !== 'onError') return;
  const fr = [...document.querySelectorAll('iframe[data-yt]')].find(f => f.contentWindow === ev.source);
  if (fr) avisoVideo(fr.closest('.video-box'), fr.dataset.yt, fr.dataset.start);
});

const PLAY = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 1l9 5-9 5z" fill="currentColor"/></svg>';

/* ---------- Diálogo ---------- */
const dlg = $('#dlg'), dlgBody = $('#dlg-body');
function openDialog(html) {
  dlgBody.innerHTML = html;
  if (typeof dlg.showModal === 'function') dlg.showModal(); else dlg.setAttribute('open', '');
  const f = dlgBody.querySelector('input,select,textarea'); if (f) f.focus();
}
function closeDialog() { dlgBody.innerHTML = ''; if (dlg.open) dlg.close(); }
dlg.addEventListener('click', e => { if (e.target === dlg) closeDialog(); });
dlg.addEventListener('close', () => { dlgBody.innerHTML = ''; });

function showVideo(exId) {
  const ex = exById(exId); if (!ex) return;
  const yt = ytParse(ex.url);
  if (!yt) { openExForm(ex.id); return; }
  openDialog(`
    <div class="row spread"><div><div class="eyebrow">${esc(ex.grupo)}</div><h2>${esc(ex.nome)}</h2></div>
    <button class="btn ghost" data-act="close">Fechar</button></div>
    ${playerHtml(ex, yt)}
    ${ex.notas ? `<p style="margin:0">${esc(ex.notas)}</p>` : ''}`);
}

/* ---------- Roteamento ---------- */
const ui = { tab: {}, busca: '', grupo: '' };
function route() {
  const h = location.hash.slice(1) || 'alunos';
  const sess = getSessao();
  if (!sess) { renderLogin(); return; }
  document.body.classList.remove('sem-login');
  document.body.classList.toggle('papel-aluno', sess.papel === 'aluno');
  if (sess.papel === 'aluno' && !/^(meu-|meus-|minha-)/.test(h)) { location.hash = 'meu-inicio'; return; }
  if (/^(meu-|meus-|minha-)/.test(h)) { renderAluno(h); return; }
  document.body.classList.remove('modo-aluno');
  let view = h, arg = null;
  if (h.startsWith('aluno-')) { view = 'aluno'; arg = h.slice(6); }
  document.querySelectorAll('[data-nav]').forEach(a => a.toggleAttribute('aria-current', false));
  const navKey = view === 'aluno' ? 'alunos' : view;
  const cur = document.querySelector(`[data-nav="${navKey}"]`); if (cur) cur.setAttribute('aria-current', 'page');
  const app = $('#app');
  if (view === 'exercicios') app.innerHTML = viewExercicios();
  else if (view === 'backup') app.innerHTML = viewBackup();
  else if (view === 'aluno' && alunoById(arg)) app.innerHTML = viewAluno(alunoById(arg));
  else app.innerHTML = viewAlunos();
}
function rerender() { const y = window.scrollY; route(); window.scrollTo(0, y); }
new MutationObserver(() => mostraStatus()).observe(document.getElementById('app'), { childList: true });
window.addEventListener('hashchange', () => { route(); window.scrollTo(0, 0); });

function bannerExemplo() {
  if (!db.exemplo) return '';
  return `<div class="banner"><span class="chip accent">Dados de exemplo</span><span class="banner-txt">Os alunos e treinos abaixo são dados de exemplo para você ver como a app funciona.</span>
  <button class="btn sm" data-act="limpar-exemplo">Começar do zero</button></div>`;
}

/* ---------- Vista: lista de alunos ---------- */
function ultimaSessao(a) { return a.sessoes.slice().sort((x, y) => y.data.localeCompare(x.data))[0]; }
function viewAlunos() {
  const lista = db.alunos.slice().sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
  return `${bannerExemplo()}
  <div class="page-head"><div><div class="eyebrow">${lista.length} ${lista.length === 1 ? 'aluno' : 'alunos'}</div><h1>Alunos</h1></div>
  <div class="row"><a class="btn" href="#meu-inicio">Ver como aluno</a><button class="btn primary" data-act="novo-aluno">+ Novo aluno</button></div></div>

function chartSVG(pts, unidade) {
  if (pts.length < 2) return `<p class="muted small" style="margin:0">Registre pelo menos duas vezes para ver o gráfico.</p>`;
  const W = 520, H = 200, L = 44, R = 16, T = 14, B = 28;
  const xs = pts.map(p => new Date(p.x + 'T12:00').getTime()), ys = pts.map(p => +p.y);
  let y0 = Math.min(...ys), y1 = Math.max(...ys);
  if (y0 === y1) { y0 -= 1; y1 += 1; }
  const pad = (y1 - y0) * 0.15; y0 -= pad; y1 += pad;
  const step = niceStep((y1 - y0) / 4); y0 = Math.floor(y0 / step) * step; y1 = Math.ceil(y1 / step) * step;
  const x0 = Math.min(...xs), x1 = Math.max(...xs) === x0 ? x0 + 1 : Math.max(...xs);
  const sx = x => L + (x - x0) / (x1 - x0) * (W - L - R), sy = y => T + (1 - (y - y0) / (y1 - y0)) * (H - T - B);
  let grid = '';
  for (let v = y0; v <= y1 + 1e-9; v += step) grid += `<line class="grid" x1="${L}" x2="${W - R}" y1="${sy(v)}" y2="${sy(v)}"/><text x="${L - 6}" y="${sy(v) + 4}" text-anchor="end">${fmtNum(v)}</text>`;
  const path = pts.map((p, i) => `${i ? 'L' : 'M'}${sx(xs[i]).toFixed(1)},${sy(ys[i]).toFixed(1)}`).join(' ');
  const area = `${path} L${sx(xs[xs.length - 1]).toFixed(1)},${H - B} L${sx(xs[0]).toFixed(1)},${H - B} Z`;
  const lbl = i => `<text x="${sx(xs[i])}" y="${H - 8}" text-anchor="${i === 0 ? 'start' : 'end'}">${fmtData(pts[i].x).slice(0, 5)}</text>`;
  const dots = pts.map((p, i) => `<circle class="dot ${i === pts.length - 1 ? 'last' : ''}" cx="${sx(xs[i])}" cy="${sy(ys[i])}" r="${i === pts.length - 1 ? 4.5 : 3.5}"><title>${fmtData(p.x)}: ${fmtNum(p.y)} ${unidade}</title></circle>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de evolução em ${unidade}">${grid}<path class="area" d="${area}" opacity=".6"/><path class="line" d="${path}"/>${dots}${lbl(0)}${lbl(pts.length - 1)}</svg>`;
}
function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw || 1))); const n = raw / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }
function delta(pts, unidade, menosEhMelhor) {
  if (pts.length < 2) return '';
  const d = pts[pts.length - 1].y - pts[0].y; if (!d) return `<span class="chip num">sem variação</span>`;
  const bom = menosEhMelhor ? d < 0 : d > 0;
  return `<span class="chip ${bom ? 'ok' : ''} num">${d > 0 ? '+' : ''}${fmtNum(d)} ${unidade}</span>`;
}

function tabEvolucao(a) {
  const meds = a.medidas.slice().sort((x, y) => x.data.localeCompare(y.data));
  const serie = k => meds.filter(m => m[k] !== '' && m[k] != null && !isNaN(m[k])).map(m => ({ x: m.data, y: +m[k] }));
  const peso = serie('peso');
  // carga máxima por exercício ao longo das sessões
  const porEx = {};
  a.sessoes.slice().sort((x, y) => x.data.localeCompare(y.data)).forEach(s => s.itens.forEach(i => {
    if (!i.feito || i.carga === '' || isNaN(i.carga)) return;
    const arr = (porEx[i.exId] ||= []); const last = arr[arr.length - 1];
    if (last && last.x === s.data) last.y = Math.max(last.y, +i.carga); else arr.push({ x: s.data, y: +i.carga });
  }));
  const exIds = Object.keys(porEx).filter(id => exById(id));
  const selEx = ui.exEvo && porEx[ui.exEvo] ? ui.exEvo : exIds[0];
  return `<div class="grid-2">
    <div class="panel"><div class="row spread"><div><div class="eyebrow">Peso corporal</div><h2 class="num">${peso.length ? fmtNum(peso[peso.length - 1].y) + ' kg' : '—'}</h2></div>${delta(peso, 'kg', true)}</div>
      ${chartSVG(peso, 'kg')}</div>
    <div class="panel"><div class="row spread"><div><div class="eyebrow">Carga máxima</div><h2 class="num">${selEx ? fmtNum(porEx[selEx][porEx[selEx].length - 1].y) + ' kg' : '—'}</h2></div>${selEx ? delta(porEx[selEx], 'kg', false) : ''}</div>
      ${exIds.length ? `<select id="evo-ex" data-act-change="evo-ex" aria-label="Exercício do gráfico">${exIds.map(id => `<option value="${id}" ${id === selEx ? 'selected' : ''}>${esc(exById(id).nome)}</option>`).join('')}</select>${chartSVG(porEx[selEx], 'kg')}`
        : `<p class="muted small" style="margin:0">Registre sessões com carga para acompanhar a progressão.</p>`}</div>
  </div>
  <div class="panel">
    <div><div class="eyebrow">Pesos usados nos treinos</div><h2>Cargas por exercício</h2></div>
    ${exIds.length ? `<div class="table-wrap"><table class="num"><thead><tr><th>Exercício</th><th class="num">Início</th><th class="num">Atual</th><th class="num">Evolução</th><th class="num">Plano</th><th class="num">Sessões</th></tr></thead>
    <tbody>${exIds.map(id => { const arr = porEx[id], ini = arr[0].y, atu = arr[arr.length - 1].y, d = atu - ini;
      const plano = a.treinos.flatMap(t => t.itens).find(i => i.exId === id);
      const pct = ini ? Math.round(d / ini * 100) : 0;
      return `<tr><td>${esc(exById(id).nome)}</td><td class="num">${fmtNum(ini)} kg</td><td class="num"><b>${fmtNum(atu)} kg</b></td>
      <td class="num ${d > 0 ? 'kg-up' : 'muted'}">${d > 0 ? '+' : ''}${fmtNum(d)} kg${d ? ` (${d > 0 ? '+' : ''}${pct}%)` : ''}</td>
      <td class="num">${plano && plano.carga !== '' ? fmtNum(plano.carga) + ' kg' : '—'}</td><td class="num">${arr.length}</td></tr>`; }).join('')}</tbody></table></div>`
    : `<p class="muted" style="margin:0">Registre uma sessão para ver aqui o peso de cada exercício.</p>`}
  </div>
  <div class="panel">
    <div class="row spread"><h2>Medidas</h2><button class="btn primary sm" data-act="nova-medida" data-id="${a.id}">+ Nova avaliação</button></div>
    ${meds.length ? `<div class="table-wrap"><table class="num"><thead><tr><th>Data</th><th class="num">Peso kg</th><th class="num">% gordura</th><th class="num">Cintura cm</th><th class="num">Quadril cm</th><th class="num">Braço cm</th><th></th></tr></thead>

    : `<p class="muted" style="margin:0">Nenhuma avaliação ainda. Registre peso e medidas para acompanhar a evolução.</p>`}
  </div>`;
}

function ultimaCarga(a, exId) {

  return null;
}

    <div>${t.itens.map((it, i) => { const ex = exById(it.exId); const n = Math.max(1, Math.min(10, +it.series || 1)); const prev = ultimaCarga(a, it.exId);

        <input type="number" step="0.5" min="0" inputmode="decimal" id="s-c-${i}-${j}" class="num" value="${esc(it.carga)}" aria-label="Peso série ${j + 1} em kg">

    </div>`; }).join('')}</div>
    <label class="field">Observações da sessão<textarea id="s-nota" placeholder="Dores, ajustes, como o aluno se sentiu…"></textarea></label>
    <label class="row small" style="gap:8px"><input type="checkbox" id="s-atualizar"> Atualizar as cargas do plano com as cargas de hoje</label>

function textoPlano(a) {
  const linhas = [`PLANO DE TREINO · ${a.nome}`];
  if (a.objetivo) linhas.push(`Objetivo: ${a.objetivo}`);
  a.treinos.forEach((t, ti) => {
    linhas.push('', `TREINO ${LETRAS[ti]}${t.nome ? ' · ' + t.nome : ''}`);
    t.itens.forEach((it, i) => {
      const ex = exById(it.exId); const yt = ex && ytParse(ex.url);
      const partes = [`${it.series}x${it.reps}`]; if (it.carga !== '' && it.carga != null) partes.push(`${fmtNum(it.carga)} kg`); if (it.descanso) partes.push(`descanso ${it.descanso}s`);
      linhas.push(`${i + 1}. ${ex ? ex.nome : '—'}: ${partes.join(' · ')}${it.obs ? ` (${it.obs})` : ''}`);
      if (yt) linhas.push(`   Vídeo: ${ytWatch(yt)}`);
    });
  });
  return linhas.join('\n');
}

/* ================= SINCRONIZAÇÃO ENTRE APARELHOS (demo) ================= */
const API = '/api/dados';
let pushTimer = null, emVoo = false;
const meuPapel = () => { const se = getSessao(); return se ? se.papel : ''; };
function dadosRemotos() { const c = JSON.parse(JSON.stringify(db)); delete c.alunoAtivo; return c; }
async function api(method, body) {
  const r = await fetch(API, { method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined, cache: 'no-store' });
  let j = null; try { j = await r.json(); } catch (e) {}
  return { status: r.status, j };
}
function agendaPush() { if (sync.status === 'desligada') return; clearTimeout(pushTimer); pushTimer = setTimeout(push, 500); }
function mergeRemoto(local, remote) {
  const uniao = (a = [], b = []) => { const ids = new Set(a.map(x => x.id)); return a.concat(b.filter(x => !ids.has(x.id))); };
  const par = (lista, a) => lista.find(x => x.id === a.id) || lista.find(x => norm(x.nome) === norm(a.nome));
  if (meuPapel() === 'aluno') { // a aluna só acrescenta sessões e medidas; o resto vem do personal
    const out = JSON.parse(JSON.stringify(remote));
    local.alunos.forEach(la => { const ra = par(out.alunos, la); if (ra) { ra.sessoes = uniao(ra.sessoes, la.sessoes); ra.medidas = uniao(ra.medidas, la.medidas); } });
    out.alunoAtivo = local.alunoAtivo; return out;
  }
  const out = JSON.parse(JSON.stringify(local)); // o personal manda no plano; recebe as sessões e medidas da aluna
  out.alunos.forEach(la => { const ra = par(remote.alunos, la); if (ra) { la.sessoes = uniao(la.sessoes, ra.sessoes); la.medidas = uniao(la.medidas, ra.medidas); } });
  return out;
}
function rerenderSeguro() {
  const ae = document.activeElement;
  if (dlg.open) return;
  if (ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName) && !ae.closest('#f-login')) return;
  rerender();
}
function mostraStatus() {
  const t = { ativa: 'Sincronização entre aparelhos: ativa', desligada: 'Sincronização não configurada: os dados ficam só neste aparelho', erro: 'Sem ligação ao servidor: a tentar de novo', inicio: 'Sincronização: a ligar…' }[sync.status];
  document.querySelectorAll('.sync-status').forEach(el => { el.textContent = t; el.dataset.estado = sync.status; });
}
async function push() {
  if (emVoo || sync.status === 'desligada' || !sync.dirty) return;
  if (meuPapel() === '') return;
  emVoo = true;
  try {
    for (let tent = 0; tent < 3 && sync.dirty; tent++) {
      const v = sync.v;
      const r = await api('PUT', { baseRev: sync.rev, data: dadosRemotos() });
      if (r.status === 200) { sync.rev = r.j.rev; if (sync.v === v) sync.dirty = false; saveSync(); sync.status = 'ativa'; break; }
      if (r.status === 409 && r.j && r.j.data) { db = mergeRemoto(db, r.j.data); sync.rev = r.j.rev; sync.v++; saveLocal(); saveSync(); sync.status = 'ativa'; continue; }
      sync.status = (r.status === 503 || r.status === 404) ? 'desligada' : 'erro'; break;
    }
  } catch (e) { sync.status = 'erro'; }
  emVoo = false; mostraStatus();
  if (sync.dirty && sync.status === 'ativa') agendaPush();
}
async function pull(forcar) {
  if (sync.status === 'desligada' || emVoo) return;
  try {
    const r = await api('GET');

    case 'iniciar': if (t) { iniciarTreino(a, t); } break;
    case 'abrir': ev.preventDefault(); { const i = +b.dataset.i; wk.aberto = wk.aberto === i ? -1 : i; saveWk(); rerender(); } break;
    case 'peso': { const s = wk.itens[b.dataset.i].sets[b.dataset.j]; s.carga = Math.max(0, (+s.carga || 0) + (+b.dataset.d)); saveWk();
      const inp = $(`#w-c-${b.dataset.i}-${b.dataset.j}`); if (inp) inp.value = s.carga; break; }
    case 'check': {
      const i = +b.dataset.i, j = +b.dataset.j, w = wk.itens[i], s = w.sets[j];
      s.done = !s.done; saveWk();
      const tr = a.treinos.find(x => x.id === wk.treinoId);
      if (s.done) {
        if (w.sets.every(x => x.done)) { const nx = wk.itens.findIndex((x, k) => k > i && !x.sets.every(y => y.done)); wk.aberto = nx; saveWk(); }
        else startRest(+tr.itens[i].descanso || 60);
      }
      rerender(); break; }
    case 'rest-mais': restEnd += 15000; tickRest(); break;
    case 'rest-fim': restEnd = 1; tickRest(); break;
    case 'cancelar':
      confirmar('Cancelar este treino?', 'Cancelar treino', () => { wk = null; saveWk(); location.hash = 'meus-treinos'; }); break;
    case 'concluir': {
      const tr = a.treinos.find(x => x.id === wk.treinoId);
      const nSets = wk.itens.reduce((s, i) => s + i.sets.filter(x => x.done).length, 0);
      openDialog(`<form id="f-concluir" class="dlg" style="padding:0">
        <div><div class="eyebrow">${esc(treinoLabel(a, tr))}</div><h2>Como foi o treino?</h2></div>
        ${nSets ? '' : '<div class="small" style="color:var(--danger)">Você ainda não marcou nenhuma série como feita.</div>'}
        <fieldset class="pse"><legend class="small muted">Esforço de 0 (muito leve) a 10 (máximo)</legend>
          ${Array.from({ length: 11 }, (_, k) => `<label><input type="radio" name="pse" value="${k}" ${k === 7 ? 'checked' : ''}><span class="num">${k}</span></label>`).join('')}</fieldset>
        <label class="field">Recado para o personal (opcional)<textarea id="c-nota" placeholder="Ex.: senti o joelho no agachamento"></textarea></label>
        <div class="row" style="justify-content:end"><button type="button" class="btn ghost" data-act="close">Voltar</button><button class="btn primary">Salvar treino</button></div></form>`);
      break; }
  }
});
document.addEventListener('change', ev => {
  const el = ev.target; const k = el.dataset.sedit; if (!k || !wk) return;
  const s = wk.itens[el.dataset.i].sets[el.dataset.j];
  s[k] = k === 'carga' ? (el.value === '' ? '' : +el.value) : el.value; saveWk();
});
document.addEventListener('submit', ev => {
  if (ev.target.id !== 'f-concluir') return;
  ev.preventDefault();
  const a = alunoById(wk.alunoId), t = a.treinos.find(x => x.id === wk.treinoId);
  const pse = (ev.target.querySelector('input[name=pse]:checked') || {}).value || '';
  const itens = wk.itens.map(w => {
    const done = w.sets.filter(s => s.done), base = done.length ? done : w.sets;
    const top = base.reduce((m, s) => (+s.carga || 0) > (+m.carga || 0) ? s : m, base[0]);
    return { exId: w.exId, carga: top.carga, reps: top.reps, feito: done.length > 0, series: done.map(s => ({ carga: s.carga, reps: s.reps })) };
  });
  const sess = { id: uid(), data: hoje(), treinoId: t.id, treinoNome: treinoLabel(a, t), rpe: pse, nota: $('#c-nota').value.trim(), itens, peloAluno: true,
    minutos: Math.max(1, Math.round((Date.now() - wk.inicio) / 6e4)) };
  a.sessoes.push(sess); save(); wk = null; saveWk(); closeDialog();
  const vol = volume(sess), nS = itens.reduce((s, i) => s + i.series.length, 0);
  location.hash = 'meu-inicio';
  setTimeout(() => openDialog(`<div style="text-align:center;display:grid;gap:10px;justify-items:center">
    <div class="eyebrow">Treino concluído</div><h2>Bom trabalho, ${esc(a.nome.split(' ')[0])}!</h2>
    <div class="mini-stats num" style="width:100%"><div><b>${nS}</b><span>séries</span></div><div><b>${fmtNum(vol)}</b><span>kg de volume</span></div><div><b>${sess.minutos || '—'}</b><span>minutos</span></div></div>
    <p class="small muted" style="margin:0">Treino salvo no histórico. Na versão completa, o personal recebe este treino na hora.</p>
    <button class="btn primary" data-act="close">Fechar</button></div>`), 50);
});

route();
pull();
})();
</script>
</body>
