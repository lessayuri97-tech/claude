<head>

<meta name="theme-color" content="#1c1c1b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PT example">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="icon" href="icon.svg" type="image/svg+xml">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: barra superior fixa + coluna única de conteúdo (máx. 1040px); fichas de treino em linhas tipo planilha que viram cartões no celular */
:root {
  --bg: #f5f4f2;
  --surface: #ffffff;
  --surface-2: #eceae7;
  --line: #dcdad5;
  --fg: #1c1c1b;
  --muted: #6b6a66;
  --accent: #262625;
  --accent-ink: #ffffff;
  --accent-soft: #e8e6e2;
  --ok: #3f6b4f;
  --ok-soft: #e1ebe3;
  --danger: #a3332d;
  --danger-soft: #f5e1df;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Barlow", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141414; --surface: #1c1c1b; --surface-2: #262625; --line: #353533;
    --fg: #ecebe8; --muted: #a09e99; --accent: #e8e6e2; --accent-ink: #161616; --accent-soft: #2e2e2c;
    --ok: #8fc29f; --ok-soft: #22302a; --danger: #e8877f; --danger-soft: #3a2220;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141414; --surface: #1c1c1b; --surface-2: #262625; --line: #353533;
  --fg: #ecebe8; --muted: #a09e99; --accent: #e8e6e2; --accent-ink: #161616; --accent-soft: #2e2e2c;
  --ok: #8fc29f; --ok-soft: #22302a; --danger: #e8877f; --danger-soft: #3a2220;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; letter-spacing: .01em; line-height: 1.1; margin: 0; text-wrap: balance; }
h1 { font-size: 2rem; }
h2 { font-size: 1.5rem; }
h3 { font-size: 1.2rem; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.eyebrow { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }

/* Barra superior */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.topbar .wrap { display: flex; align-items: center; gap: 16px; padding-block: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--fg); }
.brand-mark { width: 34px; height: 34px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; }
.brand-mark svg { width: 22px; height: 22px; }
.brand b { font-family: var(--font-display); font-size: 1.45rem; letter-spacing: .02em; }
.nav { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
.nav a { text-decoration: none; color: var(--muted); font-weight: 600; padding: 6px 12px; border-radius: 999px; }
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.nav a:hover { color: var(--fg); }

main.wrap { padding-block: 24px 64px; display: grid; gap: 20px; }

/* Botões e campos */
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 7px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; text-decoration: none; color: var(--fg); white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--fg); background: var(--surface-2); }
.btn.danger { color: var(--danger); }
.btn.sm { padding: 4px 10px; font-size: .85rem; }
.btn.icon { padding: 6px; width: 32px; height: 32px; justify-content: center; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spread { justify-content: space-between; }
label.field { display: grid; gap: 4px; font-size: .85rem; color: var(--muted); font-weight: 600; min-width: 0; }
input[type=text], input[type=url], input[type=tel], input[type=password], input[type=date], input[type=number], input[type=search], select, textarea {
  width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; color: var(--fg); font-weight: 400; font-size: .95rem; min-width: 0;
}
textarea { resize: vertical; min-height: 64px; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.form-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
.form-grid .wide { grid-column: 1 / -1; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: grid; gap: 14px; min-width: 0; }
.chip { display: inline-block; font-size: .75rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.chip.accent { background: var(--accent-soft); color: var(--accent); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.banner { background: var(--accent-soft); color: var(--fg); border-radius: var(--radius); padding: 10px 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: .9rem; }
.banner .btn { margin-left: auto; }
.empty { text-align: center; padding: 28px 16px; color: var(--muted); display: grid; gap: 10px; justify-items: center; }

/* Lista de alunos */
.page-head { display: flex; gap: 12px; align-items: end; flex-wrap: wrap; justify-content: space-between; }
.cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.card-aluno { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 10px; text-decoration: none; color: var(--fg); }
.card-aluno:hover { border-color: var(--accent); }
.card-aluno .top { display: flex; gap: 12px; align-items: center; }
.avatar-ini { width: 42px; height: 42px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; color: var(--muted); flex: none; }
.card-aluno h3 { font-size: 1.25rem; }
.stats { display: flex; gap: 16px; flex-wrap: wrap; font-size: .85rem; color: var(--muted); }
.stats b { color: var(--fg); font-weight: 600; }

/* Detalhe do aluno */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 10px 16px; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }

/* Ficha de treino */
.treino { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.treino-head { display: flex; gap: 10px; align-items: center; padding: 12px 14px; background: var(--surface-2); flex-wrap: wrap; }
.treino-letter { font-family: var(--font-display); font-size: 1.4rem; font-weight: 700; width: 36px; height: 36px; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); border-radius: 8px; flex: none; }
.treino-head input { max-width: 320px; font-weight: 600; }
.treino-head .row { margin-left: auto; }
.ficha-cols, .ficha-row { display: grid; grid-template-columns: 28px minmax(0, 2.4fr) 70px 80px 80px 80px minmax(0, 1.4fr) 128px; gap: 8px; align-items: center; padding: 8px 14px; }
.ficha-cols { font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--line); }
.ficha-row { border-bottom: 1px solid var(--line); }
.ficha-row:last-child { border-bottom: 0; }
.ficha-row .ord { font-family: var(--font-display); font-weight: 700; color: var(--muted); font-size: 1.1rem; }
.ficha-row input, .ficha-row select { padding: 6px 8px; font-size: .9rem; }
.ex-cell { display: flex; gap: 8px; align-items: center; min-width: 0; }
.ex-cell select { flex: 1; }
.play { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); cursor: pointer; display: grid; place-items: center; }
.play svg { width: 12px; height: 12px; margin-left: 2px; }
.play.novideo { background: transparent; color: var(--muted); border: 1.5px dashed var(--line); }
.play[disabled] { background: var(--surface-2); color: var(--muted); cursor: default; }
.ficha-actions { display: flex; gap: 2px; justify-content: end; }
.treino-foot { padding: 10px 14px; display: flex; gap: 8px; flex-wrap: wrap; }
.m-label { display: none; }
@media (min-width: 1100px) { body:not(.modo-aluno) .wrap { max-width: 1280px; } }
.treino { border-radius: 16px; }
.treino-head { padding: 16px 18px; gap: 14px; background: var(--surface); border-bottom: 1px solid var(--line); }
.treino-letter { width: 46px; height: 46px; font-size: 1.7rem; border-radius: 12px; }
.th-nome { flex: 1; min-width: 200px; display: grid; gap: 2px; }
.th-nome input { max-width: none; font-family: var(--font-display); font-size: 1.35rem; font-weight: 700; border-color: transparent; background: transparent; padding-inline: 6px; }
.th-nome input:hover, .th-nome input:focus { border-color: var(--line); background: var(--surface-2); }
.th-nome .small { padding-left: 7px; }
.mais { position: relative; } .mais summary { list-style: none; cursor: pointer; font-size: 1.1rem; line-height: 1; } .mais summary::-webkit-details-marker { display: none; }
.mais-menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 20; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 12px 30px rgba(0,0,0,.15); padding: 6px; display: grid; min-width: 220px; }
.mais-menu button { text-align: left; background: none; border: 0; padding: 10px 12px; border-radius: 8px; font: inherit; cursor: pointer; color: var(--fg); }
.mais-menu button:hover { background: var(--surface-2); } .mais-menu .danger { color: var(--danger); }
.exc-lista { display: grid; gap: 10px; padding: 12px 16px; background: var(--surface-2); }
.exc { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; display: grid; gap: 8px; }
.exc.com-tec { border-left: 4px solid var(--fg); }
.exc-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.exc-n { font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; width: 30px; height: 30px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; flex: none; }
.exc-top .ex-cell { flex: 1; min-width: 240px; }
.ex-sel { font-weight: 600; font-size: 1rem; }
.tec-pill { border-radius: 99px; padding: 6px 28px 6px 14px; font-size: .85rem; font-weight: 600; width: auto; border-style: dashed; color: var(--muted); background-color: transparent; }
.tec-pill.on { background-color: var(--fg); color: var(--bg); border: 1px solid var(--fg); border-style: solid; }
.exc-top .ficha-actions { margin-left: auto; }
.met.tec { border-left: 2px solid var(--fg); padding-left: 10px; }
.met.tec input, .met.tec select { width: 78px; padding: 8px; text-align: center; }
.met.tec input[type=text] { width: 170px; text-align: left; }
.exc-met, .exc-tec { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
.met { display: grid; gap: 3px; }
.met span { font-size: .68rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
.exc-met .met:not(.nota):not(.tec) input { width: 84px; text-align: center; font-family: var(--font-display); font-size: 1.15rem; font-weight: 600; padding: 8px; }
.met.nota { flex: 1; min-width: 220px; }
.exc-tec { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; }
.exc-tec .met input { width: 96px; text-align: center; } .exc-tec .met input[type=text] { width: 150px; }
.exc-tec .tec-expl { flex-basis: 100%; }
.treino-foot { padding: 12px 18px; }
.plano-tools { margin-bottom: 4px; }
.modelo-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.tec-cell { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; align-items: end; padding: 8px 10px; border-radius: 10px; background: var(--accent-soft); }
.tec-cell label { display: grid; gap: 2px; }
.tec-cell .m-label { display: block; font-size: .68rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
.tec-cell input[type=number] { width: 84px; } .tec-cell input[type=text] { width: 130px; } .tec-cell select { min-width: 150px; }
.tec-expl { flex-basis: 100%; font-size: .8rem; color: var(--muted); margin: 0; }
.chip.tec { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.dica.tec { border-left: 3px solid var(--fg); }

/* Biblioteca de exercícios */
.nav-badge { background: var(--fg); color: var(--bg); border-radius: 99px; font-size: .7rem; padding: 1px 7px; margin-left: 4px; font-weight: 700; }
.rv { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; gap: 10px; }
.rv.novo { border-left: 4px solid var(--fg); }
.rv-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.rv-top a { color: inherit; text-decoration: none; font-size: 1.05rem; } .rv-top a:hover { text-decoration: underline; }
.rv-chips { gap: 6px; }
.rv-ex { display: grid; gap: 2px; border-top: 1px solid var(--line); padding-top: 8px; }
.rv-l { display: grid; grid-template-columns: minmax(180px, 1fr) 2fr; gap: 4px 16px; padding: 5px 0; border-bottom: 1px dashed var(--line); align-items: baseline; }
.rv-l:last-child { border-bottom: 0; } .rv-nota { grid-column: 2; color: var(--fg); }
.rv-d { font-size: .8rem; font-weight: 700; margin-left: 8px; } .rv-d.up { color: var(--ok); } .rv-d.down { color: var(--danger); }
.rv-nota-fim { background: var(--surface-2); border-radius: 10px; padding: 8px 12px; font-size: .92rem; }
@media (max-width: 760px) { .rv-l { grid-template-columns: 1fr; } .rv-nota { grid-column: 1; } }
.lib-filtros { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.lib-filtros input { max-width: 300px; } .lib-filtros select { max-width: 210px; }
.pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pill { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 12px; font: inherit; font-size: .85rem; font-weight: 600; cursor: pointer; color: var(--fg); }
.pill .num { color: var(--muted); font-weight: 500; margin-left: 2px; }
.pill.on { background: var(--fg); color: var(--bg); border-color: var(--fg); } .pill.on .num { color: inherit; opacity: .7; }
.lib-tab { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.lib-cab, .lib-row { display: grid; grid-template-columns: 34px minmax(180px, 2.2fr) 130px 140px minmax(160px, 2fr) 74px 60px; gap: 8px; align-items: center; padding: 6px 14px; }
.lib-cab { font-size: .7rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; background: var(--surface-2); padding-block: 8px; }
.lib-row { border-top: 1px solid var(--line); }
.lib-row input, .lib-row select { padding: 5px 8px; font-size: .88rem; min-height: 34px; }
.lib-row .lib-nome { font-weight: 600; border-color: transparent; background: transparent; }
.lib-row .lib-nome:hover, .lib-row .lib-nome:focus { border-color: var(--line); background: var(--surface); }
.lib-row .invalido { border-color: var(--danger); }
@media (max-width: 900px) { .lib-cab { display: none; } .lib-row { grid-template-columns: 34px minmax(0, 1fr) minmax(0, 1fr); } .lib-row .lib-nome { grid-column: 2 / -1; } .lib-row .lib-url { grid-column: 1 / -1; } .lib-row .lib-uso { display: none; } }

.lib { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.ex-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; display: grid; grid-template-rows: auto 1fr; }
.thumb { position: relative; aspect-ratio: 16 / 9; max-width: 100%; background: var(--surface-2); border: 0; padding: 0; cursor: pointer; display: block; width: 100%; overflow: hidden; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb .ph { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: .85rem; text-align: center; padding: 12px; }
.thumb .bigplay { position: absolute; inset: 0; margin: auto; width: 52px; height: 36px; border-radius: 10px; background: rgba(20, 20, 20, .78); display: grid; place-items: center; }
.thumb .bigplay svg { width: 16px; height: 16px; fill: #fff; margin-left: 3px; }
.thumb[disabled] { cursor: default; }
.ex-body { padding: 12px 14px; display: grid; gap: 6px; align-content: start; }
.ex-body h3 { font-size: 1.15rem; }
.filters { display: flex; gap: 10px; flex-wrap: wrap; }
.filters input { max-width: 280px; }
.filters select { max-width: 200px; }

/* Sessões e medidas */
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
td.num, th.num { text-align: right; }
.sessao { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 6px; background: var(--surface); }
.sessao ul { margin: 0; padding-left: 18px; font-size: .9rem; }
.reg-ex { padding: 12px 0; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.reg-ex:last-child { border-bottom: 0; }
.reg-ex .head { display: flex; gap: 10px; align-items: center; }
.reg-ex .head input { width: 20px; height: 20px; flex: none; }
.sets { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; padding-left: 30px; }
.set { display: grid; grid-template-columns: 24px minmax(0, 1fr) 12px minmax(0, .8fr); gap: 4px; align-items: center; background: var(--surface-2); border-radius: 8px; padding: 6px 8px; }
.set b { font-family: var(--font-display); color: var(--muted); }
.set input { padding: 5px 6px; text-align: right; }
.set input::-webkit-inner-spin-button, .set input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.set input[type=number] { -moz-appearance: textfield; appearance: textfield; }
.set .x { color: var(--muted); text-align: center; font-size: .85rem; }
.set-legend { padding-left: 30px; font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
.reg-ex.off .sets { opacity: .45; }
.kg-up { color: var(--ok); font-weight: 600; }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font-body); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .line { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.chart .area { fill: var(--accent-soft); stroke: none; }
.chart .dot { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }
.chart .dot.last { fill: var(--accent); }
.grid-2 { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.grid-2 > * { min-width: 0; }

/* Modal */
dialog { border: 0; border-radius: 14px; padding: 0; background: var(--surface); color: var(--fg); width: min(760px, calc(100vw - 32px)); max-height: calc(100vh - 48px); box-shadow: 0 24px 60px rgba(0, 0, 0, .35); }

/* ---------- Armazenamento ---------- */

/* Aceita: youtube.com/watch?v=ID, youtu.be/ID, /shorts/ID, /embed/ID, /live/ID, m.youtube.com, ou só o ID */
function ytParse(url) {
  const s = String(url || '').trim();
  if (!s) return null;
  const m = s.match(/(?:youtube(?:-nocookie)?\.com\/(?:watch\?(?:[^#]*&)?v=|embed\/|shorts\/|live\/|v\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);
  const id = m ? m[1] : (/^[A-Za-z0-9_-]{11}$/.test(s) ? s : null);
  if (!id) return null;
  let start = 0;
  const t = s.match(/[?&#](?:t|start)=(?:(\d+)h)?(?:(\d+)m)?(\d+)?s?/);
  if (t) start = (+(t[1] || 0)) * 3600 + (+(t[2] || 0)) * 60 + (+(t[3] || 0));
  return { id, start };
}
const ytThumb = id => `https://i.ytimg.com/vi/${id}/hqdefault.jpg`;
const ytWatch = yt => `https://www.youtube.com/watch?v=${yt.id}${yt.start ? '&t=' + yt.start + 's' : ''}`;
const ytEmbed = (yt, auto) => `https://www.youtube-nocookie.com/embed/${yt.id}?rel=0&modestbranding=1${yt.start ? '&start=' + yt.start : ''}${auto ? '&autoplay=1&playsinline=1&enablejsapi=1' + (/^https?:$/.test(location.protocol) ? '&origin=' + encodeURIComponent(location.origin) : '') : ''}`;
/* Player no próprio lugar: o iframe é criado no toque do utilizador, por isso o iOS deixa tocar logo (autoplay + playsinline) */
const playerHtml = (ex, yt) => `<div class="video-box"><iframe src="${ytEmbed(yt, true)}" data-yt="${yt.id}" data-start="${yt.start || 0}" title="${esc(ex.nome)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen; clipboard-write" allowfullscreen></iframe></div>`;
function avisoVideo(box, id, start) {
  if (!box) return;
  const url = `https://www.youtube.com/watch?v=${id}${+start ? '&t=' + start + 's' : ''}`;
  box.innerHTML = `<div class="video-aviso"><b>Este vídeo não pode ser reproduzido aqui.</b><span>O dono do vídeo bloqueou a reprodução em outros sites.</span><a class="btn sm" href="${url}" target="_blank" rel="noopener">Ver no YouTube</a></div>`;
}
document.addEventListener('load', e => { // liga a escuta de erros do player do YouTube
  const f = e.target; if (!f || f.tagName !== 'IFRAME' || !f.dataset.yt) return;
  try { f.contentWindow.postMessage(JSON.stringify({ event: 'listening', id: 1, channel: 'widget' }), '*'); } catch (err) {}
}, true);
window.addEventListener('message', ev => {
  let host = ''; try { host = new URL(ev.origin).hostname; } catch (e) { return; }
  if (!/(^|\.)youtube(-nocookie)?\.com$/.test(host)) return;
  let d = ev.data; if (typeof d === 'string') { try { d = JSON.parse(d); } catch (e) { return; } }
  if (!d || d.event !== 'onError') return;
  const fr = [...document.querySelectorAll('iframe[data-yt]')].find(f => f.contentWindow === ev.source);
  if (fr) avisoVideo(fr.closest('.video-box'), fr.dataset.yt, fr.dataset.start);
});

  const navKey = view === 'aluno' ? 'alunos' : view;
  const cur = document.querySelectorAll(`[data-nav="${navKey}"]`); cur.forEach(c => c.setAttribute('aria-current', 'page'));
  const nr = db.alunos.reduce((n, a) => n + a.sessoes.filter(x => x.revisto === false).length, 0);
  ['badge-rever', 'badge-rever2'].forEach(id => { const el = document.getElementById(id); if (el) { el.hidden = !nr; el.textContent = nr; } });

}

function chartSVG(pts, unidade) {
  if (pts.length < 2) return `<p class="muted small" style="margin:0">Registre pelo menos duas vezes para ver o gráfico.</p>`;
  const W = 520, H = 200, L = 44, R = 16, T = 14, B = 28;
  const xs = pts.map(p => new Date(p.x + 'T12:00').getTime()), ys = pts.map(p => +p.y);
  let y0 = Math.min(...ys), y1 = Math.max(...ys);
  if (y0 === y1) { y0 -= 1; y1 += 1; }
  const pad = (y1 - y0) * 0.15; y0 -= pad; y1 += pad;
  const step = niceStep((y1 - y0) / 4); y0 = Math.floor(y0 / step) * step; y1 = Math.ceil(y1 / step) * step;
  const x0 = Math.min(...xs), x1 = Math.max(...xs) === x0 ? x0 + 1 : Math.max(...xs);
  const sx = x => L + (x - x0) / (x1 - x0) * (W - L - R), sy = y => T + (1 - (y - y0) / (y1 - y0)) * (H - T - B);
  let grid = '';
  for (let v = y0; v <= y1 + 1e-9; v += step) grid += `<line class="grid" x1="${L}" x2="${W - R}" y1="${sy(v)}" y2="${sy(v)}"/><text x="${L - 6}" y="${sy(v) + 4}" text-anchor="end">${fmtNum(v)}</text>`;
  const path = pts.map((p, i) => `${i ? 'L' : 'M'}${sx(xs[i]).toFixed(1)},${sy(ys[i]).toFixed(1)}`).join(' ');
  const area = `${path} L${sx(xs[xs.length - 1]).toFixed(1)},${H - B} L${sx(xs[0]).toFixed(1)},${H - B} Z`;
  const lbl = i => `<text x="${sx(xs[i])}" y="${H - 8}" text-anchor="${i === 0 ? 'start' : 'end'}">${fmtData(pts[i].x).slice(0, 5)}</text>`;
  const dots = pts.map((p, i) => `<circle class="dot ${i === pts.length - 1 ? 'last' : ''}" cx="${sx(xs[i])}" cy="${sy(ys[i])}" r="${i === pts.length - 1 ? 4.5 : 3.5}"><title>${fmtData(p.x)}: ${fmtNum(p.y)} ${unidade}</title></circle>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de evolução em ${unidade}">${grid}<path class="area" d="${area}" opacity=".6"/><path class="line" d="${path}"/>${dots}${lbl(0)}${lbl(pts.length - 1)}</svg>`;
}
function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw || 1))); const n = raw / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }
function delta(pts, unidade, menosEhMelhor) {
  if (pts.length < 2) return '';
  const d = pts[pts.length - 1].y - pts[0].y; if (!d) return `<span class="chip num">sem variação</span>`;
  const bom = menosEhMelhor ? d < 0 : d > 0;
  return `<span class="chip ${bom ? 'ok' : ''} num">${d > 0 ? '+' : ''}${fmtNum(d)} ${unidade}</span>`;
}

function tabEvolucao(a) {

    ${exIds.length ? `<div class="table-wrap"><table class="num"><thead><tr><th>Exercício</th><th class="num">Início</th><th class="num">Atual</th><th class="num">Evolução</th><th class="num">Plano</th><th class="num">Sessões</th></tr></thead>

  </div>`;

function textoPlano(a) {
  const linhas = [`PLANO DE TREINO · ${a.nome}`];
  if (a.objetivo) linhas.push(`Objetivo: ${a.objetivo}`);
  a.treinos.forEach((t, ti) => {
    linhas.push('', `TREINO ${LETRAS[ti]}${t.nome ? ' · ' + t.nome : ''}`);
    t.itens.forEach((it, i) => {
      const ex = exById(it.exId); const yt = ex && ytParse(ex.url);
      const partes = [`${it.series}x${it.reps}`]; if (it.carga !== '' && it.carga != null) partes.push(`${fmtNum(it.carga)} kg`); if (it.descanso) partes.push(`descanso ${it.descanso}s`);
      linhas.push(`${i + 1}. ${ex ? ex.nome : '—'}: ${partes.join(' · ')}${it.obs ? ` (${it.obs})` : ''}`);
      if (it.tecnica && TECS[it.tecnica]) linhas.push(`   Técnica: ${TECS[it.tecnica].nome} (${tecTxt(it)})`);
      if (yt) linhas.push(`   Vídeo: ${ytWatch(yt)}`);
    });
  });
  return linhas.join('\n');
}

document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, a = b.dataset.id && alunoById(b.dataset.id) || (b.dataset.aluno && alunoById(b.dataset.aluno));
  const t = a && (b.dataset.treino) && a.treinos.find(x => x.id === b.dataset.treino);
  switch (act) {
    case 'close': closeDialog(); break;
    case 'rever-um': { const x = a.sessoes.find(q => q.id === b.dataset.sessao); if (x) { x.revisto = x.revisto === false; save(); rerender(); } break; }
    case 'rever-todos': db.alunos.forEach(al => al.sessoes.forEach(x => { if (x.revisto === false && (!ver.aluno || al.id === ver.aluno)) x.revisto = true; })); save(); rerender(); break;
    case 'ir-sessoes': ui.tab[a.id] = 'sessoes'; break;
    case 'filtro-grupo': ui.grupo = b.dataset.g; rerender(); break;
    case 'limpar-filtros': ui.grupo = ui.equip = ui.video = ui.uso = ui.busca = ''; rerender(); break;
    case 'limpar-exemplo':
      confirmar('Apagar os dados de exemplo?', 'Apagar exemplos', () => {
        db = { exemplo: false, alunos: [], modelos: db.modelos || [], exercicios: db.exercicios.map(e => ({ ...e })) }; save(); rerender(); toast('Pronto. A biblioteca de exercícios foi mantida.');
      }); break;
    case 'novo-aluno': openAlunoForm(); break;
    case 'ver-aluno': db.alunoAtivo = a.id; save(); break;
    case 'editar-aluno': openAlunoForm(a.id); break;
    case 'excluir-aluno': {
      const id = b.dataset.id; closeDialog();
      confirmar(`Excluir ${alunoById(id).nome}?`, 'Excluir aluno', () => { db.alunos = db.alunos.filter(x => x.id !== id); save(); location.hash = 'alunos'; route(); });
      break; }
    case 'tab': ui.tab[a.id] = b.dataset.tab; rerender(); break;
    case 'add-treino': a.treinos.push({ id: uid(), nome: '', itens: [] }); save(); rerender(); break;

/* ================= SINCRONIZAÇÃO ENTRE APARELHOS (demo) ================= */
const API = '/api/dados';
let pushTimer = null, emVoo = false;
const meuPapel = () => { const se = getSessao(); return se ? se.papel : ''; };
function dadosRemotos() { const c = JSON.parse(JSON.stringify(db)); delete c.alunoAtivo; return c; }
async function api(method, body) {
  const r = await fetch(API, { method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined, cache: 'no-store' });
  let j = null; try { j = await r.json(); } catch (e) {}
  return { status: r.status, j };
}
function agendaPush() { if (sync.status === 'desligada') return; clearTimeout(pushTimer); pushTimer = setTimeout(push, 500); }
function mergeRemoto(local, remote) {
  const uniaoCom = (a = [], b = []) => { const m = new Map(a.map(x => [x.id, Object.assign({}, x)])); b.forEach(x => { const y = m.get(x.id); if (y) y.lido = !!(y.lido || x.lido); else m.set(x.id, Object.assign({}, x)); }); return [...m.values()]; };
  const uniaoSess = (a = [], b = []) => { const m = new Map(a.map(x => [x.id, Object.assign({}, x)])); b.forEach(x => { const y = m.get(x.id); if (y) { if (x.revisto === true) y.revisto = true; } else m.set(x.id, Object.assign({}, x)); }); return [...m.values()]; };
  const uniao = (a = [], b = []) => { const ids = new Set(a.map(x => x.id)); return a.concat(b.filter(x => !ids.has(x.id))); };
  const par = (lista, a) => lista.find(x => x.id === a.id) || lista.find(x => norm(x.nome) === norm(a.nome));
  if (meuPapel() === 'aluno') { // a aluna só acrescenta sessões e medidas; o resto vem do personal
    const out = JSON.parse(JSON.stringify(remote));
    local.alunos.forEach(la => { const ra = par(out.alunos, la); if (ra) { ra.sessoes = uniaoSess(ra.sessoes, la.sessoes); ra.medidas = uniao(ra.medidas, la.medidas); ra.comentarios = uniaoCom(ra.comentarios, la.comentarios); } });
    out.alunoAtivo = local.alunoAtivo; return out;
  }
  const out = JSON.parse(JSON.stringify(local)); // o personal manda no plano; recebe as sessões e medidas da aluna
  out.alunos.forEach(la => { const ra = par(remote.alunos, la); if (ra) { la.sessoes = uniaoSess(la.sessoes, ra.sessoes); la.medidas = uniao(la.medidas, ra.medidas); la.comentarios = uniaoCom(la.comentarios, ra.comentarios); } });
  return out;
}
function rerenderSeguro() {
  const ae = document.activeElement;
  if (dlg.open) return;
  if (ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName) && !ae.closest('#f-login')) return;
  rerender();
}
function mostraStatus() {
  const t = { ativa: 'Sincronização entre aparelhos: ativa', desligada: 'Sincronização não configurada: os dados ficam só neste aparelho', erro: 'Sem ligação ao servidor: a tentar de novo', inicio: 'Sincronização: a ligar…' }[sync.status];
  document.querySelectorAll('.sync-status').forEach(el => { el.textContent = t; el.dataset.estado = sync.status; });
}
async function push() {
  if (emVoo || sync.status === 'desligada' || !sync.dirty) return;
  if (meuPapel() === '') return;
  emVoo = true;
  try {
    for (let tent = 0; tent < 3 && sync.dirty; tent++) {
      const v = sync.v;
      const r = await api('PUT', { baseRev: sync.rev, data: dadosRemotos() });
      if (r.status === 200) { sync.rev = r.j.rev; if (sync.v === v) sync.dirty = false; saveSync(); sync.status = 'ativa'; break; }
      if (r.status === 409 && r.j && r.j.data) { db = mergeRemoto(db, r.j.data); sync.rev = r.j.rev; sync.v++; saveLocal(); saveSync(); sync.status = 'ativa'; continue; }
      sync.status = (r.status === 503 || r.status === 404) ? 'desligada' : 'erro'; break;
    }
  } catch (e) { sync.status = 'erro'; }
  emVoo = false; mostraStatus();
  if (sync.dirty && sync.status === 'ativa') agendaPush();
}
async function pull(forcar) {
  if (sync.status === 'desligada' || emVoo) return;
  try {
    const r = await api('GET');
    if (r.status === 503 || r.status === 404) { sync.status = 'desligada'; mostraStatus(); return; }
    if (r.status !== 200 || !r.j) { sync.status = 'erro'; mostraStatus(); return; }
    sync.status = 'ativa';
    const rem = r.j;
    if (!rem.data) { if (meuPapel() === 'personal') { sync.dirty = true; sync.v++; saveSync(); push(); } mostraStatus(); return; }
    if (rem.rev > sync.rev || forcar) {
      if (sync.dirty && !forcar) { db = mergeRemoto(db, rem.data); sync.rev = rem.rev; sync.v++; saveLocal(); saveSync(); push(); }
      else { const ativo = db.alunoAtivo; db = rem.data; if (ativo) db.alunoAtivo = ativo; migra(); sync.rev = rem.rev; sync.dirty = false; saveLocal(); saveSync(); }
      rerenderSeguro();
    }
    mostraStatus();
  } catch (e) { sync.status = 'erro'; mostraStatus(); }
}
setInterval(() => { if (!document.hidden) pull(); }, 6000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) pull(); else if (sync.dirty) push(); });
window.addEventListener('focus', () => pull());
window.addEventListener('storage', e => { // outra aba do mesmo navegador guardou alterações
  if (e.key === KEY && e.newValue) { try { db = JSON.parse(e.newValue); migra(); rerenderSeguro(); } catch (err) {} }
});

const WKEY = KEY + ':treino-em-curso';
const DIAS = ['D', 'S', 'T', 'Q', 'Q', 'S', 'S'];
const isoDe = d => { const z = new Date(d.getTime() - d.getTimezoneOffset() * 6e4); return z.toISOString().slice(0, 10); };
function alunoAtivo() { const se = getSessao();
  if (se && se.papel === 'aluno') { const a = (se.nome && db.alunos.find(x => norm(x.nome) === norm(se.nome))) || alunoById(se.alunoId); if (a) return a; }
  return alunoById(db.alunoAtivo) || db.alunos.find(a => a.treinos.some(t => t.itens.length)) || db.alunos[0]; }
function treinoLabel(a, t) { return `Treino ${LETRAS[a.treinos.indexOf(t)]}${t.nome ? ' · ' + t.nome : ''}`; }
function proximoTreino(a) {
  const ts = a.treinos.filter(t => t.itens.length); if (!ts.length) return null;
  const u = ultimaSessao(a); if (!u) return ts[0];
  const i = ts.findIndex(t => t.id === u.treinoId); return ts[(i + 1) % ts.length] || ts[0];
}
function duracaoEstimada(t) { return Math.max(10, Math.round(t.itens.reduce((s, it) => s + (+it.series || 3) * (40 + (+it.descanso || 60)), 0) / 60 / 5) * 5); }
function volume(s) { return s.itens.filter(i => i.feito).reduce((v, i) => v + (i.series && i.series.length ? i.series : [{ carga: i.carga, reps: i.reps }]).reduce((x, se) => x + ((+se.carga || 0) * (parseInt(se.reps) || 0)), 0), 0); }

let wk = null; // treino em curso
try { const r = localStorage.getItem(WKEY); if (r) wk = JSON.parse(r); } catch (e) {}
function saveWk() { try { wk ? localStorage.setItem(WKEY, JSON.stringify(wk)) : localStorage.removeItem(WKEY); } catch (e) {} }
function iniciarTreino(a, t) {
  if (wk && wk.treinoId === t.id && wk.alunoId === a.id) return;
  const prevSess = {};
  a.sessoes.slice().sort((x, y) => x.data.localeCompare(y.data)).forEach(s => s.itens.forEach(i => { if (i.feito && i.series) prevSess[i.exId] = i.series; }));
  wk = { alunoId: a.id, treinoId: t.id, inicio: Date.now(), aberto: 0,
    itens: t.itens.map(it => {
      const n = Math.max(1, Math.min(10, +it.series || 3)), prev = prevSess[it.exId];
      return { exId: it.exId, sets: Array.from({ length: n }, (_, j) => ({
        carga: prev && prev[j] && prev[j].carga !== '' ? prev[j].carga : it.carga,
        reps: String(it.reps).split('-').pop(), done: false })) };
    }) };
  saveWk();
}

/* descanso cronometrado */
const rest = { ativo: false, end: 0, total: 0, pausa: 0, label: '', fim: false, esconde: 0, mudo: false };
let restTimer = null, audioCtx = null, wake = null;
try { rest.mudo = localStorage.getItem('pt-example:v1:mudo') === '1'; } catch (e) {}
const fmtT = seg => `${Math.floor(seg / 60)}:${String(seg % 60).padStart(2, '0')}`;
function liberaAudio() { try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); } catch (e) {} }
function bipes() {
  try { if (!audioCtx || rest.mudo) return; const t0 = audioCtx.currentTime;
    [0, .28, .56].forEach((d, k) => { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.type = 'sine'; o.frequency.value = k === 2 ? 1175 : 880;
      g.gain.setValueAtTime(0.0001, t0 + d); g.gain.exponentialRampToValueAtTime(0.4, t0 + d + .02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + .22);
      o.connect(g); g.connect(audioCtx.destination); o.start(t0 + d); o.stop(t0 + d + .25); }); } catch (e) {}
}
function desenhaRest() {
  const el = $('#rest'); if (!el) return;
  el.innerHTML = `<div class="rest-top"><div><div class="eyebrow" id="rest-l"></div><div id="rest-t" class="num" aria-live="off">0:00</div></div>
    <button class="btn sm" data-sact="rest-som" id="rest-som" aria-label="Som do aviso" style="min-height:44px"></button></div>
    <div class="rest-barra"><i id="rest-p"></i></div>
    <div class="rest-btns"><button class="btn sm" data-sact="rest-menos">−15s</button><button class="btn sm" data-sact="rest-mais">+15s</button>
    <button class="btn sm" data-sact="rest-pausa" id="rest-pausa">Pausar</button><button class="btn sm primary" data-sact="rest-fim">Pular</button></div>`;
}
function startRest(seg, label) {
  rest.ativo = true; rest.total = seg; rest.end = Date.now() + seg * 1000; rest.pausa = 0; rest.fim = false; rest.label = label || 'Descanso';
  const el = $('#rest'); if (!el) return; el.classList.remove('fim'); desenhaRest(); el.hidden = false; document.body.classList.add('rest-on');
  clearInterval(restTimer); restTimer = setInterval(tickRest, 250); tickRest();
}
function stopRest() {
  rest.ativo = false; rest.fim = false; clearInterval(restTimer); const el = $('#rest'); if (el) { el.hidden = true; el.classList.remove('fim'); } document.body.classList.remove('rest-on');
}
function tickRest() {
  const el = $('#rest'); if (!el || !rest.ativo) return;
  const ms = rest.pausa ? rest.pausa : rest.end - Date.now(), left = Math.max(0, Math.ceil(ms / 1000));
  if (rest.fim) { if (Date.now() > rest.esconde) stopRest(); return; }
  if (ms <= 0) {
    rest.fim = true; rest.esconde = Date.now() + 8000; el.classList.add('fim');
    try { navigator.vibrate && navigator.vibrate([300, 120, 300, 120, 500]); } catch (e) {}
    bipes();
    $('#rest-l').textContent = 'Descanso terminado'; $('#rest-t').textContent = 'Bora! 💪'; $('#rest-p').style.width = '0%'; return;
  }
  $('#rest-l').textContent = (rest.pausa ? 'Pausado · ' : '') + rest.label; $('#rest-t').textContent = fmtT(left);
  $('#rest-p').style.width = Math.min(100, ms / (rest.total * 1000) * 100) + '%';
  const pb = $('#rest-pausa'); if (pb) pb.textContent = rest.pausa ? 'Retomar' : 'Pausar';
  const sb = $('#rest-som'); if (sb) sb.textContent = rest.mudo ? '🔕 Sem som' : '🔔 Som';
}
async function pedeWake() { try { if (!wake && wk && navigator.wakeLock && document.visibilityState === 'visible') { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } } catch (e) {} }
function soltaWake() { try { wake && wake.release(); } catch (e) {} wake = null; }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { if (rest.ativo) tickRest(); if (wk) pedeWake(); } });

document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-sact]'); if (!b) return;
  const a = alunoAtivo(); const act = b.dataset.sact;
  const t = b.dataset.treino && a.treinos.find(x => x.id === b.dataset.treino);
  switch (act) {
    case 'sair': document.body.classList.remove('modo-aluno'); stopRest(); soltaWake(); break;
    case 'logout': setSessao(null); wk = null; saveWk(); stopRest(); soltaWake(); location.hash = ''; route(); break;
    case 'forcar-envio': (async () => { try { const g = await api('GET'); if (g.status !== 200) { toast('Sincronização indisponível'); return; }
      const r = await api('PUT', { baseRev: g.j.rev || 0, data: dadosRemotos() });
      if (r.status === 200) { sync.rev = r.j.rev; sync.dirty = false; saveSync(); sync.status = 'ativa'; mostraStatus(); toast('Dados enviados para a nuvem'); } else toast('Não foi possível enviar'); } catch (e) { toast('Sem ligação'); } })(); break;
    case 'forcar-recebimento': pull(true).then(() => toast('Dados recebidos da nuvem')); break;
    case 'iniciar': if (t) { iniciarTreino(a, t); } break;
    case 'abrir': ev.preventDefault(); { const i = +b.dataset.i; wk.aberto = wk.aberto === i ? -1 : i; saveWk(); rerender(); } break;
    case 'peso': { const s = wk.itens[b.dataset.i].sets[b.dataset.j]; s.carga = Math.max(0, (+s.carga || 0) + (+b.dataset.d)); saveWk();
      const inp = $(`#w-c-${b.dataset.i}-${b.dataset.j}`); if (inp) inp.value = s.carga; break; }
    case 'reps': { const s = wk.itens[b.dataset.i].sets[b.dataset.j]; s.reps = String(Math.max(0, (parseInt(s.reps) || 0) + (+b.dataset.d))); saveWk();
      const inp = $(`#w-r-${b.dataset.i}-${b.dataset.j}`); if (inp) inp.value = s.reps; break; }
    case 'check': {
      const i = +b.dataset.i, j = +b.dataset.j, w = wk.itens[i], s = w.sets[j];
      s.done = !s.done; saveWk();
      const tr = a.treinos.find(x => x.id === wk.treinoId);
      if (s.done) {
        if (w.sets.every(x => x.done)) { const nx = wk.itens.findIndex((x, k) => k > i && !x.sets.every(y => y.done)); wk.aberto = nx; saveWk(); }
        liberaAudio();
        const nx = wk.aberto; const prox = nx >= 0 && wk.itens[nx] ? exById(tr.itens[nx].exId) : null;
        const seg = +tr.itens[i].descanso || 60;
        if (w.sets.every(x => x.done)) { if (wk.itens.every(x => x.sets.every(y => y.done))) stopRest(); else startRest(seg, prox ? 'Descanso · próximo: ' + prox.nome : 'Descanso'); }
        else startRest(seg, `Descanso · próxima: ${j + 2}ª série`);
      } else if (rest.ativo) stopRest();
      rerender(); break; }
    case 'rest-mais': if (rest.ativo && !rest.fim) { rest.total += 15; rest.pausa ? rest.pausa += 15000 : rest.end += 15000; tickRest(); } break;
    case 'rest-menos': if (rest.ativo && !rest.fim) { rest.pausa ? rest.pausa -= 15000 : rest.end -= 15000; if ((rest.pausa || rest.end - Date.now()) <= 0) stopRest(); else tickRest(); } break;
    case 'rest-pausa': if (rest.ativo && !rest.fim) { if (rest.pausa) { rest.end = Date.now() + rest.pausa; rest.pausa = 0; } else rest.pausa = Math.max(1, rest.end - Date.now()); tickRest(); } break;
    case 'rest-fim': stopRest(); break;
    case 'rest-som': rest.mudo = !rest.mudo; try { localStorage.setItem('pt-example:v1:mudo', rest.mudo ? '1' : '0'); } catch (e) {} liberaAudio(); tickRest(); break;
    case 'rest-start': { liberaAudio(); const tr = a.treinos.find(x => x.id === wk.treinoId); const ex = exById(tr.itens[+b.dataset.i].exId); startRest(+tr.itens[+b.dataset.i].descanso || 60, 'Descanso · ' + (ex ? ex.nome : '')); break; }
    case 'comentar': abreComentario(); break;
    case 'cancelar':
      confirmar('Cancelar este treino?', 'Cancelar treino', () => { wk = null; saveWk(); stopRest(); soltaWake(); location.hash = 'meus-treinos'; }); break;
    case 'concluir': {
      const tr = a.treinos.find(x => x.id === wk.treinoId);
      const nSets = wk.itens.reduce((s, i) => s + i.sets.filter(x => x.done).length, 0);
      openDialog(`<form id="f-concluir" class="dlg" style="padding:0">
        <div><div class="eyebrow">${esc(treinoLabel(a, tr))}</div><h2>Como foi o treino?</h2></div>
        ${nSets ? '' : '<div class="small" style="color:var(--danger)">Você ainda não marcou nenhuma série como feita.</div>'}
        <fieldset class="pse"><legend class="small muted">Esforço de 0 (muito leve) a 10 (máximo)</legend>
          ${Array.from({ length: 11 }, (_, k) => `<label><input type="radio" name="pse" value="${k}" ${k === 7 ? 'checked' : ''}><span class="num">${k}</span></label>`).join('')}</fieldset>
        <label class="field">Recado para o personal (opcional)<textarea id="c-nota" placeholder="Ex.: senti o joelho no agachamento"></textarea></label>
        <div class="row" style="justify-content:end"><button type="button" class="btn ghost" data-act="close">Voltar</button><button class="btn primary">Salvar treino</button></div></form>`);
      break; }
  }
});
document.addEventListener('change', ev => {
  const el = ev.target; const k = el.dataset.sedit; if (!k || !wk) return;
  const s = wk.itens[el.dataset.i].sets[el.dataset.j];
  s[k] = k === 'carga' ? (el.value === '' ? '' : +el.value) : el.value; saveWk();
});
document.addEventListener('input', ev => {
  const el = ev.target; if (el.dataset && el.dataset.nedit !== undefined && wk && wk.itens[el.dataset.nedit]) { wk.itens[el.dataset.nedit].nota = el.value; saveWk(); }
});
document.addEventListener('submit', ev => {
  if (ev.target.id === 'f-comentario') {
    ev.preventDefault(); const a = alunoAtivo(), tx = $('#cm-texto').value.trim(); if (!a || !tx) return;
    novoComentario(a, tx); save(); closeDialog(); toast('Comentário enviado ao personal'); return;
  }
  if (ev.target.id !== 'f-concluir') return;
  ev.preventDefault();
  const a = alunoById(wk.alunoId), t = a.treinos.find(x => x.id === wk.treinoId);
  const pse = (ev.target.querySelector('input[name=pse]:checked') || {}).value || '';
  const itens = wk.itens.map(w => {
    const done = w.sets.filter(s => s.done), base = done.length ? done : w.sets;
    const top = base.reduce((m, s) => (+s.carga || 0) > (+m.carga || 0) ? s : m, base[0]);
    const pi = t.itens.find(x => x.exId === w.exId) || {};
    return { exId: w.exId, tecnica: pi.tecnica || '', tp: pi.tp || null, carga: top.carga, reps: top.reps, feito: done.length > 0, nota: (w.nota || '').trim(), series: done.map(s => ({ carga: s.carga, reps: s.reps })) };
  });
  const sess = { id: uid(), revisto: false, data: hoje(), treinoId: t.id, treinoNome: treinoLabel(a, t), rpe: pse, nota: $('#c-nota').value.trim(), itens, peloAluno: true,
    minutos: Math.max(1, Math.round((Date.now() - wk.inicio) / 6e4)) };
  a.sessoes.push(sess);
  itens.forEach(i => { if (i.nota) novoComentario(a, i.nota, { exId: i.exId, treinoNome: sess.treinoNome, sessaoId: sess.id }); });
  if (sess.nota) novoComentario(a, sess.nota, { treinoNome: sess.treinoNome, sessaoId: sess.id });
  save(); wk = null; saveWk(); closeDialog(); stopRest(); soltaWake();
  const vol = volume(sess), nS = itens.reduce((s, i) => s + i.series.length, 0);
  location.hash = 'meu-inicio';
  setTimeout(() => openDialog(`<div style="text-align:center;display:grid;gap:10px;justify-items:center">
    <div class="eyebrow">Treino concluído</div><h2>Bom trabalho, ${esc(a.nome.split(' ')[0])}!</h2>
    <div class="mini-stats num" style="width:100%"><div><b>${nS}</b><span>séries</span></div><div><b>${fmtNum(vol)}</b><span>kg de volume</span></div><div><b>${sess.minutos || '—'}</b><span>minutos</span></div></div>
    <p class="small muted" style="margin:0">Treino salvo no histórico. Na versão completa, o personal recebe este treino na hora.</p>
    <button class="btn primary" data-act="close">Fechar</button></div>`), 50);
});

route();
pull();
})();
</script>
</body>
</html>
